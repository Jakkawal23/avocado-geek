document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

\u002Fhelmet>\n<div style=\"font-family: Sarabun, system-ui, sans-serif; color: #2C2C2C; background: #FBFAF6; min-height: 100vh;\">\n\n  <header style=\"position: sticky; top: 0; z-index: 20; background: rgba(251,250,246,0.92); backdrop-filter: blur(10px); border-bottom: 1px solid #E7E4D9;\">\n    <div style=\"max-width: 1200px; margin: 0 auto; padding: 16px 24px; display: flex; align-items: center; gap: 32px;\">\n      <a href=\"#\" sc-camel-on-click=\"{{ goHome }}\" style=\"display: flex; align-items: center; gap: 10px; flex-shrink: 0;\">\n        <span style=\"width: 34px; height: 34px; border-radius: 50% 50% 48% 48% / 60% 60% 40% 40%; background: #2D5F2E; display: block; position: relative;\">\n          <span style=\"position: absolute; inset: 9px 10px; border-radius: 50%; background: #F5A623; display: block;\"><\u002Fspan>\n        <\u002Fspan>\n        <span style=\"font-family: Poppins, Sarabun, sans-serif; font-weight: 700; font-size: 19px; letter-spacing: -0.01em; color: #2D5F2E;\">Avocado Geek<\u002Fspan>\n      <\u002Fa>\n      <nav style=\"display: flex; align-items: center; gap: 28px; font-size: 15px; font-weight: 500; margin-left: auto;\">\n        <a href=\"#\" sc-camel-on-click=\"{{ goVarieties }}\" style=\"color: #2C2C2C;\" style-hover=\"color: #2D5F2E;\">สายพันธุ์<\u002Fa>\n        <a href=\"#\" sc-camel-on-click=\"{{ goBlog }}\" style=\"color: #2C2C2C;\" style-hover=\"color: #2D5F2E;\">ความรู้<\u002Fa>\n        <a href=\"#\" sc-camel-on-click=\"{{ goSellers }}\" style=\"color: #2C2C2C;\" style-hover=\"color: #2D5F2E;\">ร้านค้ารับรอง<\u002Fa>\n        <a href=\"#\" sc-camel-on-click=\"{{ goAbout }}\" style=\"color: #2C2C2C;\" style-hover=\"color: #2D5F2E;\">เกี่ยวกับเรา<\u002Fa>\n      <\u002Fnav>\n      <div style=\"display: flex; align-items: center; gap: 10px;\">\n        <a href=\"#\" sc-camel-on-click=\"{{ goTrace }}\" style=\"display: inline-flex; align-items: center; gap: 7px; border: 1px solid #D8D4C6; background: #fff; color: #4A4A42; pad  max-width: 48ch;\">เลือกสายพันธุ์ที่เหมาะกับพื้นที่ของคุณ แล้วไปต่อที่ร้านค้าที่เราตรวจสอบแล้ว<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display: flex; flex-wrap: wrap; gap: 12px; justify-content: flex-end;\">\n        <a href=\"#\" sc-camel-on-click=\"{{ goVarieties }}\" style=\"background: #F5A623; color: #3A2A00; padding: 15px 28px; border-radius: 12px; font-weight: 700; font-size: 16px;\" style-hover=\"background: #FFB846; color: #3A2A00;\">เริ่มต้น<\u002Fa>\n        <a href=\"#\" sc-camel-on-click=\"{{ goContact }}\" style=\"border: 1px solid rgba(255,255,255,0.35); color: #fff; padding: 15px 28px; border-radius: 12px; font-weight: 600; font-size: 16px;\" style-hover=\"border-color: #fff; color: #fff;\">ถามชุมชน<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isBlog }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"max-width: 1200px; margin: 0 auto; padding: 40px 24px 80px;\">\n    <div style=\"display: flex; align-items: center; gap: 8px; font-size: 13px; color: #7A7A70; margin-bottom: 28px;\">\n      <a href=\"#\" sc-camel-on-click=\"{{ goHome }}\">หน้าแรก<\u002Fa><span>/<\u002Fspan><span>บล็อกความรู้<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display: flex; flex-direction: column; gap: 10px; margin-bottom: 36px;\">\n      <h1 style=\"font-family: Poppins, Sarabun, sans-serif; font-size: clamp(32px, 4vw, 48px); font-weight: 700; margin: 0; color: #1F4420; letter-spacing: -0.02em;\">องค์ความรู้อโวคาโด้<\u002Fh1>\n      <p style=\"font-size: 17px; color: #666; margin: 0; max-width: 66ch; line-height: 1.7;\">บทความที่เขียนจากเอกสารวิชาการและคู่มือส่งเสริมการเกษตร อ้างอิงแหล่งข้อมูลอย่าง UC IPM, UC ANR และศูนย์วิจัยหลังการเก็บเกี่ยว UC Davis พร้อมปรับให้เข้ากับสภาพการปลูกในไทย<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: 1fr; gap: 40px;\">\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 40px;\">\n        <div style=\"display: flex; flex-direction: column; gap: 40px; grid-column: 1 / -1;\">\n\n          <div style=\"display: flex; flex-wrap: wrap; gap: 12px; align-items: center;\">\n            <div style=\"flex: 1 1 280px; display: flex; align-items: center; gap: 10px; background: #fff; border: 1px solid #E7E4D9; border-radius: 12px; padding: 13px 16px;\">\n              <span style=\"color: #9A9A90; font-size: 15px;\">⌕<\u002Fspan>\n              <input placeholder=\"ค้นหาบทความ เช่น รากเน่า, ทาบกิ่ง, ปุ๋ย\" style=\"border: none; outline: none; font-family: Sarabun, sans-serif; font-size: 15px; width: 100%; background: transparent; color: #2C2C2C;\">\n            <\u002Fdiv>\n            <div style=\"display: flex; flex-wrap: wrap; gap: 8px;\">\n              <sc-for list=\"{{ blogTags }}\" as=\"t\" hint-placeholder-count=\"6\">\n                <span style=\"border: 1px solid #E7E4D9; background: #fff; color: #4A4A42; font-size: 14px; font-weight: 500; padding: 9px 16px; border-radius: 999px; cursor: pointer;\" style-hover=\"border-color: #2D5F2E; color: #2D5F2E;\">{{ t }}<\u002Fspan>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ hasVarietyFilter }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; background: #EAF3E6; border: 1px solid #CFE2CB; border-radius: 14px; padding: 16px 20px;\">\n              <span style=\"font-size: 15px; color: #1F4420; line-height: 1.6;\">กรองบทความที่เกี่ยวกับสายพันธุ์ <strong>{{ filterLabel }}<\u002Fstrong> — พบ {{ filterCount }} บทความ<\u002Fspan>\n              <a href=\"#\" sc-camel-on-click=\"{{ clearFilter }}\" style=\"font-size: 14px; font-weight: 600; white-space: nowrap;\">ล้างตัวกรอง ✕<\u002Fa>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ noFilterMatch }}\" hint-placeholder-val=\"{{ false }}\">\n            <span style=\"font-size: 15px; line-height: 1.7; color: #7A7A70; background: #F3F1E8; border: 1px solid #E7E4D9; border-radius: 12px; padding: 16px 20px;\">ยังไม่มีบทความที่กล่าวถึงสายพันธุ์นี้โดยเฉพาะ — ด้านล่างคือบทความทั้งหมดที่ใช้ได้กับทุกสายพันธุ์<\u002Fspan>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ showFeatured }}\" hint-placeholder-val=\"{{ true }}\">\n          <a href=\"#\" sc-camel-on-click=\"{{ openFeatured }}\" style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 0; background: #fff; border: 1px solid #E7E4D9; border-radius: 20px; overflow: hidden; color: #2C2C2C;\" style-hover=\"border-color: #70B75C; color: #2C2C2C;\">\n            <div style=\"min-height: 320px; background: repeating-linear-gradient(135deg, #E6EEE2 0 14px, #DCE7D7 14px 28px); display: grid; place-items: center;\">\n              <span style=\"font-family: 'Courier New', monospace; font-size: 12px; color: #4E6B4A;\">featured image — 1200×800<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"padding: clamp(24px, 3vw, 40px); display: flex; flex-direction: column; gap: 14px; justify-content: center;\">\n              <span style=\"align-self: flex-start; background: #F5A623; color: #3A2A00; font-size: 12px; font-weight: 700; padding: 5px 12px; border-radius: 999px;\">บทความแนะนำ<\u002Fspan>\n              <h2 style=\"font-family: Poppins, Sarabun, sans-serif; font-size: clamp(24px, 2.6vw, 32px); font-weight: 600; line-height: 1.35; margin: 0; color: #1F4420; text-wrap: pretty;\">{{ featured.title }}<\u002Fh2>\n              <p style=\"font-size: 16px; line-height: 1.75; color: #666; margin: 0;\">{{ featured.excerpt }}<\u002Fp>\n              <div style=\"display: flex; align-items: center; gap: 10px; font-size: 13px; color: #7A7A70; margin-top: 4px;\">\n                <span>{{ featured.author }}<\u002Fspan><span>·<\u002Fspan><span>{{ featured.date }}<\u002Fspan><span>·<\u002Fspan><span>อ่าน {{ featured.read }} นาที<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fa>\n          <\u002Fsc-if>\n\n          <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 32px;\">\n            <sc-for list=\"{{ posts }}\" as=\"p\" hint-placeholder-count=\"6\">\n              <a href=\"#\" sc-camel-on-click=\"{{ p.open }}\" style=\"display: flex; flex-direction: column; gap: 13px; color: #2C2C2C;\" style-hover=\"color: #2D5F2E;\">\n                <div style=\"aspect-ratio: 16 / 10; border-radius: 16px; background: repeating-linear-gradient(135deg, #ECEADF 0 12px, #E3E0D3 12px 24px); display: grid; place-items: center; border: 1px solid #E7E4D9;\">\n                  <span style=\"font-family: 'Courier New', monospace; font-size: 11px; color: #7A7A70;\">article image<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"display: flex; align-items: center; gap: 10px; font-size: 13px; color: #7A7A70;\">\n                  <span style=\"background: #EAF3E6; color: #2D5F2E; font-weight: 600; padding: 4px 10px; border-radius: 999px;\">{{ p.tag }}<\u002Fspan>\n                  <span>อ่าน {{ p.read }} นาที<\u002Fspan>\n                <\u002Fdiv>\n                <span style=\"font-family: Poppins, Sarabun, sans-serif; font-size: 19px; font-weight: 600; line-height: 1.42; color: #1F4420; text-wrap: pretty;\">{{ p.title }}<\u002Fspan>\n                <span style=\"font-size: 15px; line-height: 1.7; color: #666;\">{{ p.excerpt }}<\u002Fspan>\n                <span style=\"font-size: 13px; color: #9A9A90;\">{{ p.author }} · {{ p.date }}<\u002Fspan>\n              <\u002Fa>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ showPagination }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display: flex; justify-content: center; align-items: center; gap: 8px; padding-top: 16px;\">\n            <span style=\"width: 40px; height: 40px; border-radius: 10px; background: #2D5F2E; color: #fff; display: grid; place-items: center; font-weight: 600; font-size: 15px;\">1<\u002Fspan>\n            <span style=\"width: 40px; height: 40px; border-radius: 10px; border: 1px solid #E7E4D9; background: #fff; color: #4A4A42; display: grid; place-items: center; font-weight: 500; font-size: 15px; cursor: pointer;\" style-hover=\"border-color: #2D5F2E;\">2<\u002Fspan>\n            <span style=\"width: 40px; height: 40px; border-radius: 10px; border: 1px solid #E7E4D9; background: #fff; color: #4A4A42; display: grid; place-items: center; font-weight: 500; font-size: 15px; cursor: pointer;\" style-hover=\"border-color: #2D5F2E;\">3<\u002Fspan>\n            <span style=\"color: #9A9A90; padding: 0 6px;\">…<\u002Fspan>\n            <span style=\"height: 40px; padding: 0 16px; border-radius: 10px; border: 1px solid #E7E4D9; background: #fff; color: #4A4A42; display: grid; place-items: center; font-weight: 500; font-size: 15px; cursor: pointer;\" style-hover=\"border-color: #2D5F2E;\">ถัดไป →<\u002Fspan>\n          <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isArticle }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"max-width: 1200px; margin: 0 auto; padding: 40px 24px 80px;\">\n    <div style=\"display: flex; align-items: center; gap: 8px; font-size: 13px; color: #7A7A70; margin-bottom: 24px; flex-wrap: wrap;\">\n      <a href=\"#\" sc-camel-on-click=\"{{ goHome }}\">หน้าแรก<\u002Fa><span>/<\u002Fspan><a href=\"#\" sc-camel-on-click=\"{{ goBlog }}\">บล็อกความรู้<\u002Fa><span>/<\u002Fspan><span>{{ article.tag }}<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 48px; align-items: start;\">\n      <article style=\"grid-column: span 2; min-width: 0; display: flex; flex-direction: column; gap: 24px;\">\n        <div style=\"display: flex; flex-direction: column; gap: 16px;\">\n          <span style=\"align-self: flex-start; background: #EAF3E6; color: #2D5F2E; font-size: 13px; font-weight: 600; padding: 6px 13px; border-radius: 999px;\">{{ article.tag }}<\u002Fspan>\n          <h1 style=\"font-family: Poppins, Sarabun, sans-serif; font-size: clamp(30px, 3.6vw, 44px); font-weight: 700; line-height: 1.22; margin: 0; color: #1F4420; letter-spacing: -0.02em; text-wrap: pretty;\">{{ article.title }}<\u002Fh1>\n          <div style=\"display: flex; align-items: center; gap: 12px; font-size: 14px; color: #7A7A70; flex-wrap: wrap;\">\n            <span style=\"width: 36px; height: 36px; border-radius: 50%; background: #EAF3E6; color: #2D5F2E; display: grid; place-items: center; font-weight: 700; font-size: 14px;\">{{ article.initial }}<\u002Fspan>\n            <span style=\"color: #2C2C2C; font-weight: 600;\">{{ article.author }}<\u002Fspan><span>·<\u002Fspan><span>{{ article.date }}<\u002Fspan><span>·<\u002Fspan><span>อ่าน {{ article.read }} นาที<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"position: relative; width: 100%; aspect-ratio: 16 / 9; border-radius: 20px; overflow: hidden; border: 1px solid #D8DFD2; background: #F3F1E8;\">\n          <image-slot id=\"{{ article.heroId }}\" shape=\"rect\" placeholder=\"{{ article.imageNote }}\"><\u002Fimage-slot>\n        <\u002Fdiv>\n        <div style=\"background: #F3F1E8; border: 1px solid #E7E4D9; border-radius: 16px; padding: 22px 26px; display: flex; flex-direction: column; gap: 10px;\">\n          <span style=\"font-family: Poppins, Sarabun, sans-serif; font-size: 15px; font-weight: 600; color: #1F4420;\">สารบัญ<\u002Fspan>\n          <sc-for list=\"{{ article.toc }}\" as=\"h\" hint-placeholder-count=\"4\">\n            <a href=\"#\" style=\"font-size: 15px; color: #4A6B47;\" style-hover=\"color: #2D5F2E;\">{{ h }}<\u002Fa>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <sc-for list=\"{{ article.body }}\" as=\"b\" hint-placeholder-count=\"5\">\n          <div style=\"display: flex; flex-direction: column; gap: 14px;\">\n            <h2 style=\"font-family: Poppins, Sarabun, sans-serif; font-size: 24px; font-weight: 600; color: #1F4420; margin: 12px 0 0; letter-spacing: -0.01em;\">{{ b.h }}<\u002Fh2>\n            <p style=\"font-size: 17px; line-height: 1.9; color: #3C3C36; margin: 0; text-wrap: pretty;\">{{ b.p }}<\u002Fp>\n            <sc-if value=\"{{ b.img }}\" hint-placeholder-val=\"{{ false }}\">\n              <figure style=\"margin: 6px 0 0; display: flex; flex-direction: column; gap: 9px;\">\n                <div style=\"position: relative; width: 100%; aspect-ratio: 16 / 9; border-radius: 16px; overflow: hidden; border: 1px solid #E7E4D9; background: #F3F1E8;\">\n                  <image-slot id=\"{{ b.imgId }}\" shape=\"rect\" placeholder=\"{{ b.img }}\"><\u002Fimage-slot>\n                <\u002Fdiv>\n                <figcaption style=\"font-size: 14px; color: #8A8A80; line-height: 1.6;\">{{ b.img }}<\u002Ffigcaption>\n              <\u002Ffigure>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <div style=\"display: flex; flex-direction: column; gap: 10px; border-top: 1px solid #E7E4D9; padding-top: 22px; margin-top: 12px;\">\n          <span style=\"font-size: 13px; color: #8A8A80;\">หัวข้อที่เกี่ยวข้อง<\u002Fspan>\n          <div style=\"display: flex; flex-wrap: wrap; gap: 8px;\">\n            <sc-for list=\"{{ article.keywords }}\" as=\"k\" hint-placeholder-count=\"4\">\n              <span style=\"background: #F3F1E8; border: 1px solid #E7E4D9; color: #4A4A42; font-size: 13px; padding: 6px 12px; border-radius: 999px;\">{{ k }}<\u002Fspan>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background: #2D5F2E; border-radius: 20px; padding: 32px; display: flex; flex-wrap: wrap; gap: 20px; align-items: center; justify-content: space-between; margin-top: 20px;\">\n          <div style=\"display: flex; flex-direction: column; gap: 6px;\">\n            <span style=\"font-family: Poppins, Sarabun, sans-serif; font-size: 21px; font-weight: 600; color: #fff;\">อยากรู้ว่าสายพันธุ์นี้เหมาะกับสวนคุณไหม?<\u002Fspan>\n            <span style=\"font-size: 15px; color: #CFE2CB;\">เปิดดูข้อมูลสายพันธุ์แบบละเอียด หรือถามในชุมชนผู้ปลูก<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: flex; gap: 10px; flex-wrap: wrap;\">\n            <a href=\"#\" sc-camel-on-click=\"{{ goVarieties }}\" style=\"background: #F5A623; color: #3A2A00; padding: 13px 22px; border-radius: 10px; font-weight: 700; font-size: 15px;\" style-hover=\"background: #FFB846; color: #3A2A00;\">ค้นหาสายพันธุ์นี้<\u002Fa>\n            <a href=\"#\" sc-camel-on-click=\"{{ goContact }}\" style=\"border: 1px solid rgba(255,255,255,0.35); color: #fff; padding: 13px 22px; border-radius: 10px; font-weight: 600; font-size: 15px;\" style-hover=\"border-color: #fff; color: #fff;\">สอบถามชุมชน<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Farticle>\n      <aside style=\"display: flex; flex-direction: column; gap: 24px; position: sticky; top: 96px;\">\n        <div style=\"background: #fff; border: 1px solid #E7E4D9; border-radius: 16px; padding: 22px; display: flex; flex-direction: column; gap: 14px;\">\n          <span style=\"font-family: Poppins, Sarabun, sans-serif; font-size: 16px; font-weight: 600; color: #1F4420;\">บทความที่เกี่ยวข้อง<\u002Fspan>\n          <sc-for list=\"{{ related }}\" as=\"r\" hint-placeholder-count=\"3\">\n            <a href=\"#\" sc-camel-on-click=\"{{ r.open }}\" style=\"display: flex; gap: 12px; align-items: flex-start; color: #2C2C2C;\" style-hover=\"color: #2D5F2E;\">\n              <span style=\"width: 56px; height: 48px; border-radius: 8px; background: repeating-linear-gradient(135deg, #ECEADF 0 8px, #E3E0D3 8px 16px); flex-shrink: 0;\"><\u002Fspan>\n              <span style=\"font-size: 14px; line-height: 1.5; font-weight: 500;\">{{ r.title }}<\u002Fspan>\n <\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"background: #F3F1E8; border: 1px solid #E7E4D9; border-radius: 20px; padding: clamp(28px, 4vw, 48px); display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 40px; margin-bottom: 64px;\">\n      <div style=\"display: flex; flex-direction: column; gap: 12px;\">\n        <h2 style=\"font-family: Poppins, Sarabun, sans-serif; font-size: 28px; font-weight: 600; margin: 0; color: #1F4420;\">มาตรฐานการรับรอง<\u002Fh2>\n        <p style=\"font-size: 16px; line-height: 1.8; color: #5A5A52; margin: 0;\">ร้านค้าที่ได้ตรารับรองจากเราต้องผ่านเกณฑ์ 4 ข้อ และตรวจทบทวนทุก 12 เดือน<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; gap: 14px;\">\n        <sc-for list=\"{{ criteria }}\" as=\"c\" hint-placeholder-count=\"4\">\n          <div style=\"display: flex; gap: 12px; align-items: flex-start;\">\n            <span style=\"width: 24px; height: 24px; border-radius: 7px; background: #2D5F2E; color: #fff; display: grid; place-items: center; font-size: 13px; flex-shrink: 0;\">✓<\u002Fspan>\n            <span style=\"font-size: 16px; line-height: 1.6; color: #3C3C36;\">{{ c }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display: flex; flex-direction: column; gap: 20px;\">\n      <h2 style=\"font-family: Poppins, Sarabun, sans-serif; font-size: 28px; font-weight: 600; margin: 0; color: #1F4420;\">คำถามที่พบบ่อย<\u002Fh2>\n      <sc-for list=\"{{ faqs }}\" as=\"f\" hint-placeholder-count=\"4\">\n        <div style=\"background: #fff; border: 1px solid #E7E4D9; border-radius: 14px; padding: 22px 26px; display: flex; flex-direction: column; gap: 8px;\">\n          <span style=\"font-size: 17px; font-weight: 600; color: #1F4420;\">{{ f.q }}<\u002Fspan>\n          <span style=\"font-size: 15px; line-height: 1.8; color: #5A5A52;\">{{ f.a }}<\u002Fspan>\n        <\u002Fdiv>
