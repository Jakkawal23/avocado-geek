20px; font-weight: 600; color: #1F4420;\">ส่งข้อความ<\u002Fspan>\n        <label style=\"display: flex; flex-direction: column; gap: 7px; font-size: 14px; font-weight: 600; color: #4A4A42;\">ชื่อ\n          <input placeholder=\"ชื่อ–นามสกุล\" style=\"font-family: Sarabun, sans-serif; font-size: 15px; padding: 13px 15px; border: 1px solid #E7E4D9; border-radius: 10px; outline: none; color: #2C2C2C;\">\n        <\u002Flabel>\n        <label style=\"display: flex; flex-direction: column; gap: 7px; font-size: 14px; font-weight: 600; color: #4A4A42;\">อีเมล\n          <input placeholder=\"you@email.com\" style=\"font-family: Sarabun, sans-serif; font-size: 15px; padding: 13px 15px; border: 1px solid #E7E4D9; border-radius: 10px; outline: none; color: #2C2C2C;\">\n        <\u002Flabel>\n        <label style=\"display: flex; flex-direction: column; gap: 7px; font-size: 14px; font-weight: 600; color: #4A4A42;\">เรื่อง\n          <span style=\"font-family: Sarabun, sans-serif; font-size: 15px; padding: 13px 15px; border: 1px solid #E7E4D9; border-radius: 10px; color: #7A7A70; cursor: pointer;\">คำถามเรื่องการปลูก ▾<\u002Fspan>\n        <\u002Flabel>\n        <label style=\"display: flex; flex-direction: column; gap: 7px; font-size: 14px; font-weight: 600; color: #4A4A42;\">ข้อความ\n          <textarea placeholder=\"เล่าให้เราฟัง…\" rows=\"5\" style=\"font-family: Sarabun, sans-serif; font-size: 15px; padding: 13px 15px; border: 1px solid #E7E4D9; border-radius: 10px; outline: none; resize: vertical; color: #2C2C2C;\"><\u002Ftextarea>\n        <\u002Flabel>\n        <span style=\"background: #2D5F2E; color: #fff; text-align: center; padding: 15px; border-radius: 12px; font-weight: 600; font-size: 16px; cursor: pointer;\" style-hover=\"background: #1F4420;\">ส่งข้อความ<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <footer style=\"background: #1F4420; color: #CFE2CB;\">\n    <div style=\"max-width: 1200px; margin: 0 auto; padding: 56px 24px 32px; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 36px;\">\n      <div style=\"display: flex; flex-direction: column; gap: 12px;\">\n        <span style=\"font-family: Poppins, Sarabun, sans-serif; font-weight: 700; font-size: 18px; color: #fff;\">Avocado Geek<\u002Fspan>\n        <span style=\"font-size: 14px; line-height: 1.7; max-width: 30ch;\">ฐานของความรู้อโวคาโด้ทั้งหมด — คู่มือของผู้ปลูกอโวคาโด้ไทย<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; gap: 10px; font-size: 14px;\">\n        <span style=\"color: #fff; font-weight: 600; margin-bottom: 4px;\">เนื้อหา<\u002Fspan>\n        <a href=\"#\" sc-camel-on-click=\"{{ goBlog }}\" style=\"color: #CFE2CB;\" style-hover=\"color: #fff;\">บล็อกความรู้<\u002Fa>\n        <a href=\"#\" sc-camel-on-click=\"{{ goVarieties }}\" style=\"color: #CFE2CB;\" style-hover=\"color: #fff;\">สายพันธุ์อโวคาโด้<\u002Fa>\n        <a href=\"#\" sc-camel-on-click=\"{{ goMatch }}\" style=\"color: #CFE2CB;\" style-hover=\"color: #fff;\">เลือกพันธุ์ให้ฉัน<\u002Fa>\n        <a href=\"#\" sc-camel-on-click=\"{{ goTrace }}\" style=\"color: #CFE2CB;\" style-hover=\"color: #fff;\">ตรวจรหัสต้น<\u002Fa>\n        <a href=\"#\" sc-camel-on-click=\"{{ goSellers }}\" style=\"color: #CFE2CB;\" style-hover=\"color: #fff;\">ร้านค้าที่รับรอง<\u002Fa>\n      <\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; gap: 10px; font-size: 14px;\">\n        <span style=\"color: #fff; font-weight: 600; margin-bottom: 4px;\">เกี่ยวกับ<\u002Fspan>\n        <a href=\"#\" sc-camel-on-click=\"{{ goAbout }}\" style=\"color: #CFE2CB;\" style-hover=\"color: #fff;\">เกี่ยวกับเรา<\u002Fa>\n        <a href=\"#\" sc-camel-on-click=\"{{ goContact }}\" style=\"color: #CFE2CB;\" style-hover=\"color: #fff;\">ติดต่อ<\u002Fa>\n        <a href=\"#\" sc-camel-on-click=\"{{ goAbout }}\" style=\"color: #CFE2CB;\" style-hover=\"color: #fff;\">คำถามที่พบบ่อย<\u002Fa>\n      <\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; gap: 10px; font-size: 14px;\">\n        <span style=\"color: #fff; font-weight: 600; margin-bottom: 4px;\">ติดตาม<\u002Fspan>\n        <a href=\"#\" style=\"color: #CFE2CB;\" style-hover=\"color: #fff;\">Facebook<\u002Fa>\n        <a href=\"#\" style=\"color: #CFE2CB;\" style-hover=\"color: #fff;\">Line Official<\u002Fa>\n        <a href=\"#\" style=\"color: #CFE2CB;\" style-hover=\"color: #fff;\">YouTube<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"max-width: 1200px; margin: 0 auto; padding: 20px 24px 40px; border-top: 1px solid rgba(255,255,255,0.14); font-size: 13px; color: #9CBD97;\">© 2026 Avocado Geek. สงวนลิขสิทธิ์ทุกประการ<\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst VARIETIES = [\n  { sku: \"TR-AVO-STD\", name: \"อโวคาโด้ ธรรมดา\", sci: \"Persea americana (ต้นเพาะเมล็ด)\", desc: \"ต้นเพาะเมล็ด ราคาย่อมเยา ใช้เป็นต้นตอได้\", stars: \"★★☆☆☆\", season: \"ก.ค.–ต.ค.\",\n    long: \"ต้นที่ได้จากการเพาะเมล็ด ไม่ใช่ต้นทาบหรือต้นเสียบยอด จึงไม่การันตีว่าผลจะเหมือนต้นแม่ — ลักษณะผล รสชาติ และช่วงเก็บเกี่ยวจะแปรปรวนไปตามการผสมข้ามพันธุ์ ข้อดีคือระบบรากแข็งแรงและราคาถูก จึงนิยมใช้เป็น 'ต้นตอ' สำหรับทาบกิ่งพันธุ์ดีในภายหลัง หากปลูกเพื่อกินผลควรเข้าใจว่าใช้เวลา 5–8 ปีจึงติดผล และคุณภาพผลคาดเดาไม่ได้\",\n    stats: [{k:\"รหัสสินค้า\",v:\"TR-AVO-STD\"},{k:\"ประเภท\",v:\"ต้นเพาะเมล็ด\"},{k:\"เริ่มให้ผล\",v:\"5–8 ปี\"},{k:\"ขนาดผล\",v:\"แปรปรวน\"},{k:\"ความยาก\",v:\"ง่าย\"},{k:\"เหมาะสำหรับ\",v:\"ทำต้นตอ / ปลูกร่มเงา\"}] },\n  { sku: \"TR-AVO-HAS\", name: \"แฮส (Hass)\", sci: \"P. americana 'Hass'\", desc: \"เนื้อครีม รสมันเข้ม สายพันธุ์การค้าอันดับหนึ่งของโลก\", stars: \"★★★☆☆\", season: \"ส.ค.–พ.ย.\",\n    long: \"ต้นแม่พันธุ์ดั้งเดิมเพาะโดย Rudolph Hass ที่เมือง La Habra Heights รัฐแคลิฟอร์เนีย และจดสิทธิบัตรในปี 1935 ปัจจุบันครองสัดส่วนอโวคาโด้การค้าของโลกกว่า 80% เป็นชนิดกัวเตมาลาเป็นหลัก เปลือกหนาขรุขระ เปลี่ยนจากเขียวเป็นม่วงดำเมื่อสุก จึงบอกความสุกได้จากสี เนื้อละเอียดมันเข้มข้น เก็บรักษาและขนส่งได้ดีกว่าพันธุ์เปลือกบาง ดอกเป็นชนิด A ในไทยให้ผลดีในพื้นที่สูงกว่า 700 เมตรที่มีอากาศเย็นช่วงออกดอก เช่น เชียงใหม่ เชียงราย ตาก น่าน และเพชรบูรณ์\",\n    stats: [{k:\"รหัสสินค้า\",v:\"TR-AVO-HAS\"},{k:\"ต้นกำเนิด\",v:\"แคลิฟอร์เนีย, 1935\"},{k:\"ชนิดดอก\",v:\"A\"},{k:\"ขนาดผล\",v:\"170–350 ก.\"},{k:\"ปริมาณน้ำมัน\",v:\"18–22%\"},{k:\"ช่วงเก็บเกี่ยว\",v:\"ส.ค.–พ.ย.\"},{k:\"พื้นที่เหมาะสม\",v:\"สูงกว่า 700 ม.\"},{k:\"ราคาตลาด\",v:\"120–180 ฿/กก.\"}] },\n  { sku: \"TR-AVO-PIN\", name: \"พิงค์เคอร์ตัน\", sci: \"P. americana 'Pinkerton'\", desc: \"ผลทรงยาวคอสั้น เมล็ดเล็ก เนื้อเยอะ น้ำมันสูง\", stars: \"★★★★☆\", season: \"ก.ย.–พ.ย.\",\n    long: \"คัดเลือกจากสวนของตระกูล Pinkerton ในแคลิฟอร์เนีย เผยแพร่ช่วงต้นทศวรรษ 1970 เป็นลูกผสมกัวเตมาลาเป็นหลัก จุดเด่นคือเมล็ดเล็กมากเมื่อเทียบกับขนาดผล ทำให้สัดส่วนเนื้อที่กินได้สูง ผิวเปลือกขรุขระปานกลาง ปอกง่าย รสมันเข้มใกล้เคียงแฮส ดอกชนิด A ต้นค่อนข้างแผ่กว้าง ให้ผลดกแต่ไวต่อการขาดน้ำและดินเค็ม ต้องคุมการให้น้ำสม่ำเสมอ\",\n    stats: [{k:\"รหัสสินค้า\",v:\"TR-AVO-PIN\"},{k:\"ต้นกำเนิด\",v:\"แคลิฟอร์เนีย, ~1972\"},{k:\"ชนิดดอก\",v:\"A\"},{k:\"ขนาดผล\",v:\"250–450 ก.\"},{k:\"ปริมาณน้ำมัน\",v:\"20–24%\"},{k:\"ช่วงเก็บเกี่ยว\",v:\"ก.ย.–พ.ย.\"},{k:\"เมล็ด\",v:\"เล็ก (เนื้อ ~75–80%)\"},{k:\"ราคาตลาด\",v:\"140–200 ฿/กก.\"}] },\n  { sku: \"TR-AVO-BUC\", name: \"บัคคาเนีย\", sci: \"P. americana 'Buccaneer'\", desc: \"พันธุ์ฟลอริดา ทนร้อนชื้น ให้ผลสม่ำเสมอ\", stars: \"★★☆☆☆\", season: \"ส.ค.–ต.ค.\",\n    long: \"พันธุ์จากฟลอริดา กลุ่มลูกผสมเวสต์อินดีส–กัวเตมาลา จึงทนอากาศร้อนชื้นและดินที่ระบายน้ำไม่ดีนักได้ดีกว่าพันธุ์แคลิฟอร์เนีย ผลทรงกลมรีขนาดกลาง เปลือกเขียวเรียบค่อนข้างบาง เนื้อรสอ่อนกว่าแฮส ปริมาณน้ำมันต่ำจึงเบาและไม่เลี่ยน เหมาะขายเป็นผลสดในตลาดท้องถิ่นและปลูกในที่ราบ\",\n    stats: [{k:\"รหัสสินค้า\",v:\"TR-AVO-BUC\"},{k:\"ต้นกำเนิด\",v:\"ฟลอริดา\"},{k:\"กลุ่มพันธุ์\",v:\"เวสต์อินดีส × กัวเตมาลา\"},{k:\"ขนาดผล\",v:\"200–350 ก.\"},{k:\"ปริมาณน้ำมัน\",v:\"8–12%\"},{k:\"ช่วงเก็บเกี่ยว\",v:\"ส.ค.–ต.ค.\"},{k:\"ความยาก\",v:\"ง่าย\"},{k:\"ราคาตลาด\",v:\"50–80 ฿/กก.\"}] },\n  { sku: \"TR-AVO-PET\", name: \"ปีเตอร์สัน\", sci: \"P. americana 'Peterson'\", desc: \"ปลูกง่าย ให้ผลเร็ว เหมาะกับผู้เริ่มต้น\", stars: \"★★☆☆☆\", season: \"ก.ค.–ก.ย.\",\n    long: \"พันธุ์กลุ่มฟลอริดาที่ปรับตัวกับอากาศร้อนของไทยได้ดี ต้นแข็งแรง เลี้ยงง่าย ทนโรคได้ดีกว่าพันธุ์ที่ต้องการอากาศเย็น มักเริ่มให้ผลภายใน 3 ปีหลังปลูกด้วยต้นทาบ ผลขนาดกลางถึงใหญ่ เปลือกเขียว เนื้อรสอ่อนถึงปานกลาง เป็นพันธุ์ที่แนะนำสำหรับสวนแรกหรือผู้ที่ยังไม่มั่นใจกับสภาพพื้นที่\",\n    stats: [{k:\"รหัสสินค้า\",v:\"TR-AVO-PET\"},{k:\"ต้นกำเนิด\",v:\"ฟลอริดา\"},{k:\"เริ่มให้ผล\",v:\"~3 ปี (ต้นทาบ)\"},{k:\"ขนาดผล\",v:\"250–400 ก.\"},{k:\"ปริมาณน้ำมัน\",v:\"12–15%\"},{k:\"ช่วงเก็บเกี่ยว\",v:\"ก.ค.–ก.ย.\"},{k:\"ความยาก\",v:\"ง่าย\"},{k:\"ราคาตลาด\",v:\"70–110 ฿/กก.\"}] },\n  { sku: \"TR-AVO-BO7\", name: \"บูท-7\", sci: \"P. americana 'Booth 7'\", desc: \"ผลใหญ่ ให้ผลดก ปลูกได้ในที่ราบ\", stars: \"★★★☆☆\", season: \"ต.ค.–ธ.ค.\",\n    long: \"หนึ่งในชุดพันธุ์ Booth จากฟลอริดา (คัดเลือกช่วงทศวรรษ 1930) เป็นลูกผสมกัวเตมาลา–เวสต์อินดีส ทนร้อนชื้นได้ดีจึงปลูกได้ในที่ราบของไทย ผลใหญ่ทรงกลมรี เปลือกหนาเขียวเรียบเป็นมัน เนื้อแน่นสีเหลือง รสมันปานกลาง เก็บเกี่ยวปลายปี ดอกเป็นชนิด B จึงใช้เป็นพันธุ์ผสมเกสรร่วมกับแฮส (ชนิด A) ได้ดี ช่วยเพิ่มการติดผลในแปลง\",\n    stats: [{k:\"รหัสสินค้า\",v:\"TR-AVO-BO7\"},{k:\"ต้นกำเนิด\",v:\"ฟลอริดา, ~1935\"},{k:\"ชนิดดอก\",v:\"B (ผสมเกสรให้แฮส)\"},{k:\"ขนาดผล\",v:\"300–500 ก.\"},{k:\"ปริมาณน้ำมัน\",v:\"8–12%\"},{k:\"ช่วงเก็บเกี่ยว\",v:\"ต.ค.–ธ.ค.\"},{k:\"ความยาก\",v:\"ปานกลาง\"},{k:\"ราคาตลาด\",v:\"60–90 ฿/กก.\"}] },\n  { sku: \"TR-AVO-BO8\", name: \"บูท-8\", sci: \"P. americana 'Booth 8'\", desc: \"ผลกลมรี ทนร้อนชื้น ติดผลสม่ำเสมอ\", stars: \"★★★☆☆\", season: \"ก.ย.–พ.ย.\",\n    long: \"อีกหนึ่งพันธุ์ในชุด Booth จากฟลอริดา กลุ่มลูกผสมกัวเตมาลา–เวสต์อินดีสเช่นเดียวกับบูท-7 จึงทนอากาศร้อนชื้นและปลูกได้ในที่ราบของไทย ต่างจากบูท-7 ที่ผลของบูท-8 มักทรงกลมรีสั้นกว่า ขนาดกลางถึงใหญ่ เปลือกหนาเขียวเป็นมัน เนื้อสีเหลืองครีมรสมันปานกลาง จุดที่ผู้ปลูกมักรายงานคือติดผลสม่ำเสมอทุกปีและทนการขนส่งได้ดีเพราะเปลือกหนา ดอกเป็นชนิด B จึงใช้เป็นพันธุ์ผสมเกสรให้พันธุ์ชนิด A อย่างแฮสได้เช่นเดียวกับบูท-7 เก็บเกี่ยวช่วงกลางถึงปลายฤดู\",\n    stats: [{k:\"รหัสสินค้า\",v:\"TR-AVO-BO8\"},{k:\"ต้นกำเนิด\",v:\"ฟลอริดา\"},{k:\"ชนิดดอก\",v:\"B (ผสมเกสรให้แฮส)\"},{k:\"ขนาดผล\",v:\"250–450 ก.\"},{k:\"ปริมาณน้ำมัน\",v:\"8–12%\"},{k:\"ช่วงเก็บเกี่ยว\",v:\"ก.ย.–พ.ย.\"},{k:\"ความยาก\",v:\"ปานกลาง\"},{k:\"ราคาตลาด\",v:\"60–95 ฿/กก.\"}] },\n  { sku: \"TR-AVO-034\", name: \"อโวคาโด้ 034\", sci: \"P. americana 'No.034'\", desc: \"พันธุ์คัดเลือกในไทย ผลผลิตดี เป็นที่รู้จักในภาคเหนือ\", stars: \"★★★☆☆\", season: \"ก.ย.–พ.ย.\",\n    long: \"พันธุ์หมายเลขที่คัดเลือกและขยายในประเทศไทย พบปลูกมากในแปลงภาคเหนือและพื้นที่โครงการส่งเสริมบนที่สูง จุดเด่นคือปรับตัวกับสภาพแวดล้อมของไทยได้ดี ต้นแข็งแรง ให้ผลดกและสม่ำเสมอ ผลขนาดกลางถึงใหญ่ เปลือกเขียวค่อนข้างหนา เนื้อเหลืองแน่น รสมันดี เป็นพันธุ์ที่เกษตรกรนิยมปลูกร่วมกับแฮสเพื่อยืดช่วงเก็บเกี่ยว หมายเหตุ: ข้อมูลเชิงตัวเลขของพันธุ์คัดเลือกในไทยยังต่างกันตามแหล่งปลูก ควรสอบถามร้านต้นพันธุ์ประกอบ\",\n    stats: [{k:\"รหัสสินค้า\",v:\"TR-AVO-034\"},{k:\"ต้นกำเนิด\",v:\"คัดเลือกในไทย\"},{k:\"ขนาดผล\",v:\"300–450 ก.\"},{k:\"ปริมาณน้ำมัน\",v:\"ปานกลาง–สูง\"},{k:\"ช่วงเก็บเกี่ยว\",v:\"ก.ย.–พ.ย.\"},{k:\"ความยาก\",v:\"ปานกลาง\"},{k:\"จุดเด่น\",v:\"ผลดก ปรับตัวดี\"},{k:\"ราคาตลาด\",v:\"80–130 ฿/กก.\"}] },\n  { sku: \"TR-AVO-PP08\", name: \"พบพระ 08\", sci: \"P. americana 'Phop Phra 08'\", desc: \"พันธุ์คัดเลือกจากอำเภอพบพระ จ.ตาก\", stars: \"★★★☆☆\", season: \"ส.ค.–ต.ค.\",\n    long: \"คัดเลือกจากแหล่งปลูกอโวคาโด้สำคัญของไทยที่อำเภอพบพระ จังหวัดตาก ซึ่งเป็นพื้นที่ที่มีอโวคาโด้ปลูกหนาแน่นที่สุดแห่งหนึ่งของประเทศ จุดเด่นคือเป็นพันธุ์ที่คัดจากต้นที่ปรับตัวและให้ผลดีในสภาพอากาศไทยอยู่แล้ว จึงเลี้ยงง่ายกว่าพันธุ์นำเข้า ผลขนาดกลางถึงใหญ่ เปลือกเขียว เนื้อแน่นรสมัน เหมาะกับตลาดในประเทศ\",\n    stats: [{k:\"รหัสสินค้า\",v:\"TR-AVO-PP08\"},{k:\"ต้นกำเนิด\",v:\"อ.พบพระ จ.ตาก\"},{k:\"ขนาดผล\",v:\"250–400 ก.\"},{k:\"ปริมาณน้ำมัน\",v:\"ปานกลาง\"},{k:\"ช่วงเก็บเกี่ยว\",v:\"ส.ค.–ต.ค.\"},{k:\"ความยาก\",v:\"ง่าย–ปานกลาง\"},{k:\"จุดเด่น\",v:\"ปรับตัวกับอากาศไทย\"},{k:\"ราคาตลาด\",v:\"70–120 ฿/กก.\"}] },\n  { sku: \"TR-AVO-RH80\", name: \"รูเฮิส 80\", sci: \"P. americana 'Ruehle'\", desc: \"ทรงพุ่มเตี้ยแผ่กว้าง เก็บง่าย เหมาะสวนเล็ก\", stars: \"★★☆☆☆\", season: \"ก.ค.–ก.ย.\",\n    long: \"พันธุ์ Ruehle จากฟลอริดา (เผยแพร่ราวปี 1954) กลุ่มเวสต์อินดีส–กัวเตมาลา ลักษณะเด่นที่สุดคือทรงต้นเตี้ยแผ่กว้าง มักสูงไม่เกิน 5 เมตร ทำให้ตัดแต่ง พ่นสาร และเก็บเกี่ยวได้โดยแทบไม่ต้องใช้บันได เหมาะกับสวนขนาดเล็กและการปลูกระยะชิด ผลขนาดกลาง เปลือกเขียวบางเป็นมัน เนื้อรสอ่อน น้ำมันต่ำ เก็บกลางฤดู\",\n    stats: [{k:\"รหัสสินค้า\",v:\"TR-AVO-RH80\"},{k:\"ต้นกำเนิด\",v:\"ฟลอริดา, ~1954\"},{k:\"ทรงต้น\",v:\"เตี้ยแผ่กว้าง (<5 ม.)\"},{k:\"ขนาดผล\",v:\"180–300 ก.\"},{k:\"ปริมาณน้ำมัน\",v:\"9–12%\"},{k:\"ช่วงเก็บเกี่ยว\",v:\"ก.ค.–ก.ย.\"},{k:\"ความยาก\",v:\"ง่าย\"},{k:\"ราคาตลาด\",v:\"55–85 ฿/กก.\"}] },\n  { sku: \"TR-AVO-CUBA\", name: \"คิวบา\", sci: \"P. americana (กลุ่มเวสต์อินดีส)\", desc: \"ผลใหญ่ เปลือกเขียวเรียบ ทนร้อน เก็บต้นฤดู\", stars: \"★★☆☆☆\", season: \"มิ.ย.–ส.ค.\",\n    long: \"ชื่อที่ใช้เรียกอโวคาโด้กลุ่มเวสต์อินดีส (แอนทิลลิส) ซึ่งเป็นกลุ่มที่ทนร้อนชื้นและทนดินเค็มได้ดีที่สุดในสามกลุ่มหลัก จึงปลูกได้ในที่ราบและพื้นที่ต่ำที่พันธุ์แฮสไม่ยอมติดผล ผลมักใหญ่ เปลือกเขียวเรียบบาง เนื้อฉ่ำ รสอ่อนหวานเล็กน้อย ปริมาณน้ำมันต่ำที่สุดในบรรดากลุ่มหลัก จึงเบาและเหมาะกินสดหรือปั่น สุกเร็วและช้ำง่าย ควรขายใกล้แหล่งปลูก\",\n    stats: [{k:\"รหัสสินค้า\",v:\"TR-AVO-CUBA\"},{k:\"กลุ่มพันธุ์\",v:\"เวสต์อินดีส\"},{k:\"ขนาดผล\",v:\"400–700 ก.\"},{k:\"ปริมาณน้ำมัน\",v:\"5–10% (ต่ำ)\"},{k:\"ช่วงเก็บเกี่ยว\",v:\"มิ.ย.–ส.ค.\"},{k:\"พื้นที่เหมาะสม\",v:\"ที่ราบ / ร้อนชื้น\"},{k:\"ความยาก\",v:\"ง่าย\"},{k:\"ราคาตลาด\",v:\"40–70 ฿/กก.\"}] },\n  { sku: \"TR-AVO-RED\", name: \"เรดเวียดนาม\", sci: \"P. americana (สายพันธุ์เวียดนาม เปลือกม่วงแดง)\", desc: \"เปลือกม่วงแดงสะดุดตา ผลใหญ่ ทนร้อนชื้น\", stars: \"★★★☆☆\", season: \"ก.ค.–ก.ย.\",\n    long: \"สายพันธุ์ที่นำเข้าจากเวียดนาม จุดขายคือเปลือกสีม่วงแดงเข้มเมื่อสุก ทำให้แตกต่างบนแผงและใช้ทำการตลาดได้ดี ผลมักทรงยาวรีขนาดใหญ่ เนื้อสีเหลืองครีม รสมันปานกลาง เป็นกลุ่มที่ปรับตัวกับอากาศร้อนชื้นได้ดีกว่าพันธุ์แคลิฟอร์เนีย จึงปลูกได้ในหลายพื้นที่ของไทย ทั้งนี้ 'เรดเวียดนาม' เป็นชื่อทางการค้าที่ครอบคลุมหลายต้นคัดเลือก คุณภาพจึงต่างกันตามแหล่งกิ่งพันธุ์ ควรซื้อจากร้านที่ระบุที่มาชัดเจน\",\n    stats: [{k:\"รหัสสินค้า\",v:\"TR-AVO-RED\"},{k:\"ต้นกำเนิด\",v:\"เวียดนาม\"},{k:\"สีเปลือกสุก\",v:\"ม่วงแดง\"},{k:\"ขนาดผล\",v:\"350–600 ก.\"},{k:\"ปริมาณน้ำมัน\",v:\"ปานกลาง\"},{k:\"ช่วงเก็บเกี่ยว\",v:\"ก.ค.–ก.ย.\"},{k:\"ความยาก\",v:\"ปานกลาง\"},{k:\"ราคาตลาด\",v:\"90–150 ฿/กก.\"}] },\n  { sku: \"TR-AVO-SEL\", name: \"อโวคาโด้ ไร้เมล็ด\", sci: \"P. americana — ผลไม่มีเมล็ด (parthenocarpic)\", desc: \"ผลเล็กเรียวไม่มีเมล็ด กินได้ทั้งลูก แปลกและขายได้ราคา\", stars: \"★★★★☆\", season: \"ตามพันธุ์แม่\",\n    long: \"ไม่ใช่สายพันธุ์แยกต่างหาก แต่เป็นผลที่เกิดโดยไม่มีการปฏิสนธิ (parthenocarpy) จึงไม่พัฒนาเมล็ด ในต่างประเทศเรียก cocktail avocado หรือ cuke ผลทรงยาวเรียวคล้ายแตงกวาเล็ก ยาวราว 5–8 เซนติเมตร เปลือกบางจนปอกหรือกินทั้งลูกได้ รสมันคล้ายผลปกติของพันธุ์นั้น มักเกิดกับพันธุ์เปลือกบางอย่างเฟอร์ทีในปีที่อากาศเย็นช่วงดอกบาน ข้อควรรู้: ปริมาณผลไร้เมล็ดที่ได้ในแต่ละปีขึ้นกับสภาพอากาศ ไม่สามารถบังคับให้ออกสม่ำเสมอได้ จึงเหมาะเป็นสินค้าเสริมมากกว่าผลผลิตหลัก\",\n    stats: [{k:\"รหัสสินค้า\",v:\"TR-AVO-SEL\"},{k:\"กลไก\",v:\"parthenocarpy (ไม่ปฏิสนธิ)\"},{k:\"ขนาดผล\",v:\"30–80 ก.\"},{k:\"ความยาว\",v:\"5–8 ซม.\"},{k:\"เมล็ด\",v:\"ไม่มี\"},{k:\"ช่วงเก็บเกี่ยว\",v:\"ตามพันธุ์แม่\"},{k:\"ความยาก\",v:\"ควบคุมผลผลิตยาก\"},{k:\"ราคาตลาด\",v:\"สินค้าเฉพาะกลุ่ม\"}] },\n  { sku: \"TR-AVO-TA21\", name: \"TA21\", sci: \"P. americana 'TA21'\", desc: \"พันธุ์คัดเลือกรหัส TA ปลูกในแปลงทดสอบภาคเหนือ\", stars: \"★★★☆☆\", season: \"ก.ย.–พ.ย.\",\n    long: \"พันธุ์ในชุดรหัส TA ที่คัดเลือกและทดสอบในแปลงของไทย ยังไม่แพร่หลายเท่าแฮสหรือพันธุ์ 034 แต่ได้รับความสนใจจากผู้ปลูกที่ต้องการกระจายสายพันธุ์และยืดช่วงเก็บเกี่ยว ผลขนาดกลางถึงใหญ่ เปลือกเขียว เนื้อแน่น รสมันปานกลางถึงเข้ม หมายเหตุ: ข้อมูลทางวิชาการที่เผยแพร่ของพันธุ์นี้ยังมีจำกัด ตัวเลขด้านล่างเป็นค่าที่รายงานจากแปลงผู้ปลูก ควรยืนยันกับร้านต้นพันธุ์ก่อนตัดสินใจปลูกเป็นแปลงใหญ่\",\n    stats: [{k:\"รหัสสินค้า\",v:\"TR-AVO-TA21\"},{k:\"ต้นกำเนิด\",v:\"คัดเลือกในไทย\"},{k:\"ขนาดผล\",v:\"250–400 ก.\"},{k:\"ปริมาณน้ำมัน\",v:\"ปานกลาง–สูง\"},{k:\"ช่วงเก็บเกี่ยว\",v:\"ก.ย.–พ.ย.\"},{k:\"ความยาก\",v:\"ปานกลาง\"},{k:\"สถานะข้อมูล\",v:\"อยู่ระหว่างรวบรวม\"},{k:\"ราคาตลาด\",v:\"90–140 ฿/กก.\"}] }\n];\n\nconst POSTS = [\n  { tag: \"เริ่มต้น\", read: 9, title: \"ทำไมต้องปลูกอโวคาโด้? ประโยชน์และข้อดีที่คุณต้องรู้\",\n    excerpt: \"คุณค่าทางอาหารตามข้อมูล USDA ราคาตลาดในไทย และเหตุผลเชิงเศรษฐกิจของการปลูกเอง\",\n    author: \"ทีมบรรณาธิการ Avocado Geek\", date: \"10 ส.ค. 2569\", imageNote: \"ผลอโวคาโด้ผ่าครึ่งบนเขียง\",\n    keywords: [\"ประโยชน์อโวคาโด้\", \"ทำไมต้องปลูกอโวคาโด้\", \"มูลค่าการปลูกอโวคาโด้\", \"อโวคาโด้ราคา\"],\n    toc: [\"คุณค่าทางอาหารที่วัดได้จริง\", \"ทำไมอโวคาโด้ราคาสูงกว่าผลไม้ทั่วไป\", \"ปลูกเองคุ้มไหม เมื่อคิดเป็นตัวเลข\", \"ข้อดีที่ไม่ใช่เรื่องเงิน\", \"ข้อจำกัดที่ต้องรู้ก่อนตัดสินใจ\", \"สรุป: ใครควรปลูก ใครยังไม่ควร\"],\n    body: [\n      { h: \"คุณค่าทางอาหารที่วัดได้จริง\", p: \"ข้อมูลจากฐาน USDA FoodData Central ระบุว่าอโวคาโด้ดิบ 100 กรัมให้พลังงานราว 160 กิโลแคลอรี ไขมันรวม 14.7 กรัม โดยเป็นไขมันไม่อิ่มตัวเชิงเดี่ยว (โอเลอิก) ราว 9.8 กรัม ไขมันอิ่มตัวเพียง 2.1 กรัม ใยอาหาร 6.7 กรัม โพแทสเซียม 485 มิลลิกรัม โฟเลต 81 ไมโครกรัม และน้ำตาลต่ำกว่า 1 กรัม จุดที่ทำให้อโวคาโด้ต่างจากผลไม้อื่นคือพลังงานเกือบทั้งหมดมาจากไขมันดี ไม่ใช่น้ำตาล นักโภชนาการจึงมักจัดอโวคาโด้ไว้ในหมวด 'ไขมันที่ดีต่อสุขภาพ' มากกว่าหมวดผลไม้\" },\n      { h: \"ทำไมอโวคาโด้ราคาสูงกว่าผลไม้ทั่วไป\", p: \"สามเหตุผลหลัก หนึ่ง — ต้นใช้เวลา 3–4 ปีหลังปลูกต้นเสียบยอดจึงเริ่มให้ผลเชิงพาณิชย์ ทำให้อุปทานตอบสนองความต้องการช้า สอง — สายพันธุ์คุณภาพสูงอย่างแฮสต้องการอากาศเย็นช่วงออกดอก พื้นที่ปลูกที่เหมาะในไทยจึงจำกัดอยู่ที่ภาคเหนือและพื้นที่สูงบางแห่ง สาม — ผลบอบบางและช้ำง่ายหลังสุก ต้นทุนการคัด บรรจุ และขนส่งจึงสูงกว่าผลไม้ทั่วไปมาก ราคาขายหน้าสวนของแฮสในไทยจึงอยู่ในระดับ 120–180 บาทต่อกิโลกรัม ขณะที่พันธุ์เปลือกเขียวรสอ่อนอยู่ราว 50–90 บาท\" },\n      { h: \"ปลูกเองคุ้มไหม เมื่อคิดเป็นตัวเลข\", p: \"คิดแบบสวนเล็ก 1 ไร่ ปลูกระยะ 6×6 เมตร ได้ราว 44 ต้น ค่าต้นเสียบยอดคุณภาพประมาณ 300–450 บาทต่อต้น รวมค่าต้นราว 15,000–20,000 บาท บวกค่าเตรียมพื้นที่และระบบน้ำ ต้นที่ให้ผลแล้วอายุ 6–8 ปีในสภาพการจัดการที่ดีอาจให้ผล 50–120 กิโลกรัมต่อต้นต่อปี ขึ้นกับสายพันธุ์ อากาศ และการดูแล จุดคุ้มทุนจริงจึงมักอยู่ที่ปีที่ 5–7 ไม่ใช่ปีที่ 2 — ใครที่คิดจะปลูกเพื่อขายควรวางแผนกระแสเงินสดให้ครอบคลุมช่วงก่อนให้ผล\" },\n      { h: \"ข้อดีที่ไม่ใช่เรื่องเงิน\", p: \"อโวคาโด้เป็นไม้ยืนต้นไม่ผลัดใบ ให้ร่มเงาและช่วยยึดดินในพื้นที่ลาดชันได้ดี ปลูกแซมในระบบวนเกษตรร่วมกับกาแฟหรือกล้วยได้ เก็บผลได้จากต้นเดิมนานหลายสิบปีโดยไม่ต้องปลูกใหม่ทุกฤดูเหมือนพืชล้มลุก และผลที่เก็บจากต้นเองมีข้อดีเชิงคุณภาพที่ตลาดให้ค่า คือเก็บได้ในระยะแก่จัดจริงแล้วบ่มให้สุกพอดีก่อนถึงผู้บริโภค ต่างจากผลที่ต้องเก็บก่อนแก่เพื่อรองรับการขนส่งไกล\" },\n      { h: \"ข้อจำกัดที่ต้องรู้ก่อนตัดสินใจ\", p: \"อโวคาโด้เป็นไม้ผลที่ไวต่อน้ำขังและความเค็มมากที่สุดกลุ่มหนึ่ง เอกสาร Drought Tip ของ UC ANR ระบุว่ารากส่วนใหญ่อยู่ในดินชั้นบนเพียงราวหนึ่งฟุต จึงดึงน้ำจากดินชั้นลึกไม่ได้และทนแล้งได้ต่ำ ในทางกลับกันดินที่ระบายน้ำไม่ดีจะเปิดทางให้เชื้อ Phytophthora cinnamomi เข้าทำลายราก ซึ่ง UC IPM จัดว่าเป็นโรคที่ร้ายแรงที่สุดของอโวคาโด้ หากพื้นที่ของคุณเป็นดินเหนียวจัดหรือมีน้ำขังในหน้าฝน ต้องแก้เรื่องการระบายน้ำให้ได้ก่อน ไม่ใช่ปลูกก่อนแล้วค่อยแก้\" },\n      { h: \"สรุป: ใครควรปลูก ใครยังไม่ควร\", p: \"ควรปลูก — ผู้ที่มีพื้นที่ระบายน้ำดี มีน้ำใช้สม่ำเสมอตลอดหน้าแล้ง และรับได้กับการรอผลผลิต 3–4 ปี ยังไม่ควรปลูกเป็นแปลงใหญ่ — ผู้ที่พื้นที่มีน้ำขังในหน้าฝนและยังไม่ได้แก้ ผู้ที่ไม่มีระบบน้ำในหน้าแล้ง หรือผู้ที่ต้องการรายได้ภายในปีเดียว ทางกลางที่ปลอดภัยคือเริ่มจาก 5–10 ต้นในสายพันธุ์ที่เลี้ยงง่ายก่อน เรียนรู้พฤติกรรมของต้นในพื้นที่ตัวเองหนึ่งรอบฤดู แล้วจึงขยาย\" }\n    ] },\n\n  { tag: \"สายพันธุ์\", read: 12, title: \"สายพันธุ์อโวคาโด้ในไทยอะไรดี? เลือกตัวไหนให้เหมาะกับคุณ\",\n    excerpt: \"เทียบสายพันธุ์หลักที่ปลูกได้ในไทย ทั้งความยาก ฤดูเก็บเกี่ยว ชนิดดอก และราคาตลาด\",\n    author: \"ทีมวิชาการ Avocado Geek\", date: \"8 ส.ค. 2569\", imageNote: \"ผลหลายสายพันธุ์เรียงเทียบขนาด\",\n    keywords: [\"สายพันธุ์อโวคาโด้ดีที่สุด\", \"เปรียบเทียบอโวคาโด้\", \"อโวคาโด้ Hass vs Fuerte\", \"สายพันธุ์อโวคาโด้ไทย\"],\n    toc: [\"เข้าใจ 3 กลุ่มพันธุ์ก่อนเลือกยี่ห้อ\", \"ชนิดดอก A และ B: เรื่องที่คนมักข้าม\", \"สายพันธุ์เด่นที่ปลูกได้ในไทย\", \"เลือกตามความสูงพื้นที่\", \"เลือกตามเป้าหมายการขาย\", \"ปลูกกี่สายพันธุ์ดี\"],\n    body: [\n      { h: \"เข้าใจ 3 กลุ่มพันธุ์ก่อนเลือกยี่ห้อ\", p: \"อโวคาโด้ทั้งโลกแบ่งเป็นสามกลุ่มพันธุกรรมหลัก กลุ่มเม็กซิกันทนหนาวได้ดีที่สุด เปลือกบางเรียบ กลิ่นใบมีกลิ่นโป๊ยกั๊ก กลุ่มกัวเตมาลาให้ผลเปลือกหนาขรุขระ ปริมาณน้ำมันสูง คุณภาพเนื้อดีที่สุด และกลุ่มเวสต์อินดีสทนร้อนชื้นและทนดินเค็มได้ดีที่สุด แต่ปริมาณน้ำมันต่ำและรสอ่อน สายพันธุ์การค้าส่วนใหญ่เป็นลูกผสมของสองในสามกลุ่มนี้ การรู้ว่าพันธุ์ที่สนใจอยู่กลุ่มใดจะบอกได้ทันทีว่ามันจะอยู่รอดในพื้นที่ของคุณหรือไม่ ก่อนดูเรื่องรสชาติหรือราคา\" },\n      { h: \"ชนิดดอก A และ B: เรื่องที่คนมักข้าม\", p: \"ดอกอโวคาโด้เป็นดอกสมบูรณ์เพศแต่ทำงานแบบ synchronous dichogamy คือดอกเดียวกันเปิดสองครั้ง ครั้งแรกเป็นเพศเมียพร้อมรับละอองเรณู ครั้งที่สองเป็นเพศผู้ปล่อยละอองเรณู พันธุ์ชนิด A เปิดเป็นเพศเมียในช่วงเช้าและเป็นเพศผู้ในช่วงบ่าย ขณะที่พันธุ์ชนิด B ตรงกันข้าม ธรรมชาติออกแบบมาเพื่อผลักดันการผสมข้ามต้น เอกสารของ UC Riverside ระบุว่าการปลูกพันธุ์ที่ชนิดดอกเสริมกันแทรกในแปลงช่วยเพิ่มการติดผลและผลผลิตได้ แฮสเป็นชนิด A ขณะที่พันธุ์กลุ่มเปลือกเขียวหลายตัวเป็นชนิด B การจับคู่จึงทำได้จริงในทางปฏิบัติ\" },\n      { h: \"สายพันธุ์เด่นที่ปลูกได้ในไทย\", p: \"แฮส — เนื้อมันเข้ม น้ำมัน 18–22% เปลือกเปลี่ยนเป็นม่วงดำเมื่อสุกจึงบอกความสุกง่าย ราคาดีที่สุด แต่ต้องการพื้นที่สูงและอากาศเย็นช่วงออกดอก พิงค์เคอร์ตัน — เมล็ดเล็กเนื้อเยอะ น้ำมันสูง รสใกล้แฮส แต่ไวต่อการขาดน้ำ บูท-7 — ผลใหญ่ ทนร้อนชื้น ปลูกได้ในที่ราบ และเป็นชนิดดอก B ที่ใช้ผสมเกสรกับแฮสได้ ปีเตอร์สัน — เลี้ยงง่ายที่สุดในกลุ่มนี้ ให้ผลเร็ว เหมาะกับสวนแรก พันธุ์คัดเลือกไทยอย่าง 034 และพบพระ 08 — ปรับตัวกับอากาศไทยได้ดีเพราะคัดจากต้นที่รอดและให้ผลดีในพื้นที่จริงอยู่แล้ว\" },\n      { h: \"เลือกตามความสูงพื้นที่\", p: \"นี่เป็นตัวกรองที่สำคัญที่สุดและแก้ไขทีหลังไม่ได้ งานวิจัยเรื่องการออกดอกระบุว่าอุณหภูมิกลางวันสูงกว่า 30 องศาหรือต่ำกว่า 20 องศาสามารถรบกวนวงจรดอกของพันธุ์กลุ่มเฟอร์ทีได้ และอุณหภูมิที่เหมาะกับการเจริญของหลอดละอองเรณูอยู่ราว 25 องศา ในทางปฏิบัติสำหรับไทยหมายความว่า พื้นที่สูงกว่า 700 เมตรที่มีกลางคืนเย็นช่วงออกดอกเหมาะกับแฮสและพิงค์เคอร์ตัน ส่วนที่ราบและพื้นที่ต่ำควรเลือกพันธุ์กลุ่มฟลอริดา–เวสต์อินดีสอย่างบูท-7 บัคคาเนีย ปีเตอร์สัน หรือพันธุ์คัดเลือกไทย\" },\n      { h: \"เลือกตามเป้าหมายการขาย\", p: \"ถ้าเป้าหมายคือตลาดพรีเมียมและร้านอาหาร ให้เน้นพันธุ์เปลือกดำน้ำมันสูงที่ผู้บริโภครู้จักชื่อ เพราะราคาต่อกิโลกรัมต่างกันเกือบเท่าตัวและตลาดยอมจ่ายกับความแน่นอนของรสชาติ ถ้าเป้าหมายคือตลาดสดในพื้นที่และเน้นปริมาณ พันธุ์เปลือกเขียวผลใหญ่ที่เลี้ยงง่ายจะให้กำไรต่อแรงงานดีกว่า เพราะต้นทุนดูแลต่ำและผลผลิตต่อต้นสูง ถ้าปลูกกินในครอบครัว ความง่ายในการเลี้ยงและช่วงเก็บเกี่ยวที่กระจายสำคัญกว่าราคา\" },\n      { h: \"ปลูกกี่สายพันธุ์ดี\", p: \"อย่างน้อยสองสายพันธุ์ และให้มีชนิดดอกต่างกันถ้าทำได้ เหตุผลมีสองข้อ ข้อแรกคือการผสมข้ามพันธุ์ช่วยเพิ่มการติดผลตามที่งานวิจัยหลายชิ้นยืนยัน ข้อสองคือการกระจายความเสี่ยง ทั้งด้านโรค ด้านสภาพอากาศในปีที่ผิดปกติ และด้านราคาตลาด สัดส่วนที่ใช้ได้ในทางปฏิบัติคือพันธุ์หลักที่ต้องการขาย 70–80% และพันธุ์ผสมเกสร/พันธุ์สำรอง 20–30% กระจายให้อยู่ในระยะที่แมลงผสมเกสรบินถึง ไม่ใช่กองไว้มุมเดียวของแปลง\" }\n    ] },\n\n  { tag: \"การปลูก\", read: 12, title: \"คู่มือการปลูกอโวคาโด้: จากแกะกล่องต้นพันธุ์สู่วันเก็บผลผลิต\",\n    excerpt: \"5 ขั้นตอนตามลำดับจริง ตั้งแต่พักฟื้นต้นที่เพิ่งมาถึง เตรียมดิน ลงปลูก ดูแลเดือนแรก จนถึงการบำรุงระยะยาว\",\n    author: \"ทีมวิชาการ Avocado Geek\", date: \"6 ส.ค. 2569\", imageNote: \"ต้นพันธุ์เสียบยอดพร้อมลงปลูก\",\n    keywords: [\"วิธีปลูกอโวคาโด้\", \"การปลูกอโวคาโด้ขั้นตอน\", \"พักฟื้นต้นอโวคาโด้\", \"ดูแลอโวคาโด้ปีแรก\", \"ดินปลูกอโวคาโด้\"],\n    toc: [\"ขั้นที่ 1 พักฟื้นต้นกล้า (สำคัญที่สุด)\", \"ขั้นที่ 2 เตรียมหลุมและผสมดินปลูก\", \"ขั้นที่ 3 ขั้นตอนการลงมือปลูก\", \"ขั้นที่ 4 การดูแลใน 1 เดือนแรก\", \"ขั้นที่ 5 การบำรุงระยะยาวถึงเก็บเกี่ยว\", \"สรุปสิ่งที่ห้ามทำเด็ดขาด\"],\n    body: [\n      { h: \"ขั้นที่ 1 — พักฟื้นต้นกล้า (สำคัญที่สุด)\", imgId: \"art-plant-1\", img: \"ภาพประกอบ: การแกะกล่องและพักฟื้นต้น\",\n        p: \"เมื่อต้นพันธุ์เดินทางมาถึงผ่านระบบขนส่ง ต้นจะเครียดและบอบช้ำจากแรงกระแทกและการอยู่ในที่มืดหลายวัน ห้ามนำลงปลูกหรือเปลี่ยนกระถางทันที สิ่งที่ต้องทำคือ แกะห่อพลาสติกที่หุ้มกระถางหรือตุ้มดินออกอย่างเบามือ ระวังไม่ให้กิ่งหรือใบหัก ห้ามแกะเทปที่พันรอยต่อเสียบยอดออก เพราะรอยต่อยังไม่แข็งแรงพอและอาจฉีกจนกิ่งพันธุ์ดีแห้งตาย ห้ามถอดไม้ค้ำยอดเดิมออก ให้คงไว้พยุงลำต้นไม่ให้โยกคลอน จากนั้นรดน้ำให้ชุ่มพอดี แล้ววางไว้ในที่แดดรำไรประมาณ 20–30% ลมโกรกสบาย เป็นเวลา 5–7 วันเพื่อให้ปรับตัวเข้ากับสภาพแวดล้อมใหม่ก่อนลงปลูก\" },\n      { h: \"ขั้นที่ 2 — เตรียมหลุมและผสมดินปลูก\", imgId: \"art-plant-2\", img: \"ภาพประกอบ: สัดส่วนดินผสมและขนาดหลุม\",\n        p: \"อโวคาโด้เป็นพืชที่กลัวน้ำขังและรากเน่าง่ายที่สุดกลุ่มหนึ่ง หัวใจของการเตรียมดินคือต้องโปร่ง ระบายน้ำได้ดีเยี่ยม เทน้ำแล้วต้องไหลผ่านสะดวกทันที สูตรดินผสมมาตรฐานที่ใช้ได้จริงคือ ดินร่วนโปร่ง 2 ส่วน + แกลบดิบหรือขุยมะพร้าวหรือกากมะพร้าวสับ 1 ส่วนเพื่อเพิ่มช่องว่างอากาศในดิน + ปุ๋ยคอกเก่าหรือปุ๋ยหมักที่ย่อยสลายแล้ว 1 ส่วน ห้ามใช้ปุ๋ยคอกใหม่ที่ยังร้อนอยู่เพราะจะทำให้รากไหม้ ขนาดหลุมปลูกให้ขุดกว้าง ลึก และยาวประมาณ 50×50×50 เซนติเมตร แล้วนำดินผสมรองก้นหลุมเตรียมไว้ หากพื้นที่เป็นดินเหนียวหรือมีน้ำขังในหน้าฝน ให้พูนดินเป็นโคกสูงกว่าระดับพื้นราว 15–20 เซนติเมตรร่วมด้วย\" },\n      { h: \"ขั้นที่ 3 — ขั้นตอนการลงมือปลูก\", imgId: \"art-plant-3\", img: \"ภาพประกอบ: การกรีดถุงและตั้งระดับดิน\",\n        p: \"ขั้นนี้ต้องระมัดระวังสูงสุดเพราะระบบรากอโวคาโด้เปราะบางมาก ใช้คัตเตอร์กรีดข้างถุงดำสองด้านแล้วค่อยๆ ประคองต้นออกมา ระวังอย่าให้ตุ้มดินแตก เพราะถ้าดินแตกรากฝอยจะขาดและต้นเหี่ยวตายได้ง่าย วางต้นลงกลางหลุม กลบดินให้แน่นปานกลาง โดยให้ระดับดินใหม่อยู่เท่ากับระดับดินเดิมในถุงพอดี ห้ามถมดินสูงจนกลบมิดรอยเทปแผลเสียบยอด เพราะความชื้นจะทำให้แผลเน่า ปักไม้ไผ่ข้างลำต้นและผูกเชือกเป็นรูปเลข 8 หลวมๆ เพื่อไม่ให้ลมพัดต้นโยก เนื่องจากการโยกจะทำให้รากที่กำลังเดินขาด สุดท้ายคลุมโคนด้วยฟางข้าวแห้งหรือเศษใบไม้แห้งหนา 2–3 นิ้ว เว้นห่างจากโคนต้นเล็กน้อย เพื่อรักษาความชื้นและกันหน้าดินแห้งจากแดด\" },\n      { h: \"ขั้นที่ 4 — การดูแลใน 1 เดือนแรก\", imgId: \"art-plant-4\", img: \"ภาพประกอบ: การพรางแสงและรดน้ำต้นใหม่\",\n        p: \"เดือนแรกคือหัวเลี้ยวหัวต่อที่ต้นกำลังสร้างรากใหม่ในดินจริง การรดน้ำให้รดวันละครั้งในตอนเช้า ให้ดินมีความชื้นแต่ห้ามแฉะหรือมีน้ำขัง วันไหนฝนตกหนักให้เว้นการรดน้ำ การพรางแสงในช่วง 1–2 สัปดาห์แรกให้ทำร่มเงาชั่วคราวหรือกางสแลนบังแดดจัดช่วงเที่ยงและบ่าย เมื่อต้นเริ่มตั้งตัวหรือแทงใบอ่อนใหม่จึงค่อยถอดสแลนออกให้รับแดดเต็มวัน และข้อสำคัญที่สุดคือห้ามใส่ปุ๋ยเคมีเด็ดขาดในเดือนแรก เพราะระบบรากยังอ่อนแอ ปุ๋ยเคมีจะทำให้รากไหม้และต้นตายได้ ให้งดไปก่อนอย่างน้อย 1–2 เดือน\" },\n      { h: \"ขั้นที่ 5 — การบำรุงระยะยาวถึงเก็บเกี่ยว\", imgId: \"art-plant-5\", img: \"ภาพประกอบ: การให้ปุ๋ยรอบชายพุ่มและการตัดแต่งทรงพุ่ม\",\n        p: \"หลังผ่านเดือนแรกต้นจะเริ่มเติบโตเร็วขึ้นชัดเจน การให้ปุ๋ยแบ่งตามช่วงอายุ ปีที่ 1–2 เน้นเร่งต้นเร่งใบ ใส่ปุ๋ยคอกเก่าหรือปุ๋ยหมักปีละ 2–3 ครั้ง เสริมด้วยปุ๋ยเคมีสูตรเสมอเช่น 16-16-16 ทุก 2–3 เดือนในปริมาณน้อยราว 1–2 กำมือต่อต้น โรยรอบชายพุ่ม ห้ามใส่ชิดโคนต้น ปีที่ 3 เป็นต้นไปเปลี่ยนมาเน้นสูตรสะสมอาหารที่ตัวหลังสูงเช่น 8-24-24 ในช่วงก่อนเข้าฤดูหนาวเพื่อกระตุ้นการออกดอก การตัดแต่งกิ่ง เมื่อต้นสูงราว 1 เมตรให้ตัดยอดเพื่อให้แตกกิ่งข้างเป็นทรงพุ่มเตี้ยที่ดูแลและเก็บผลง่าย และหมั่นตัดกิ่งแห้ง กิ่งเป็นโรค และกิ่งที่ซ้อนทับกันด้านในออกเพื่อให้แดดส่องถึงโคนต้น ระยะเวลาให้ผลผลิตของต้นเสียบยอดโดยทั่วไปจะเริ่มออกดอกและติดผลในปีที่ 3–4 หลังลงปลูก ขึ้นกับสายพันธุ์ สภาพอากาศ และการดูแล เคล็ดลับจากชาวสวนคืออโวคาโด้ชอบน้ำสม่ำเสมอแต่เกลียดน้ำขัง ในช่วงติดผลอ่อนห้ามปล่อยให้ดินแห้งขาดน้ำ เพราะจะทำให้ผลอ่อนร่วงเสียหาย\" },\n      { h: \"สรุปสิ่งที่ห้ามทำเด็ดขาด\", p: \"หนึ่ง — ห้ามลงปลูกทันทีที่ต้นมาถึง ต้องพักฟื้น 5–7 วันก่อน สอง — ห้ามแกะเทปพันรอยต่อเสียบยอดและห้ามกลบดินทับรอยต่อ สาม — ห้ามให้ตุ้มดินแตกตอนถอดถุง สี่ — ห้ามใส่ปุ๋ยเคมีในเดือนแรก ห้า — ห้ามปลูกในที่ที่มีน้ำขัง และห้ามรดน้ำซ้ำขณะดินยังชื้น หก — ห้ามใส่ปุ๋ยชิดโคนต้น เจ็ด — ห้ามปล่อยให้ต้นโยกจากลมในช่วงที่รากยังไม่ยึดดิน\" }\n    ] },\n  { tag: \"ดิน\", read: 10, title: \"ดินที่เหมาะสำหรับอโวคาโด้: pH ส่วนประกอบ และวิธีเตรียมแปลง\",\n    excerpt: \"ช่วง pH ที่เหมาะ โครงสร้างดิน การระบายน้ำ การทดสอบดิน และการคลุมโคนที่ช่วยได้จริง\",\n    author: \"ทีมวิชาการ Avocado Geek\", date: \"3 ส.ค. 2569\", imageNote: \"หน้าตัดดินร่วนปนทรายและการคลุมโคน\",\n    keywords: [\"ดินสำหรับอโวคาโด้\", \"pH อโวคาโด้\", \"การระบายน้ำอโวคาโด้\", \"เตรียมดินปลูกอโวคาโด้\"],\n    toc: [\"pH ที่เหมาะและเหตุผลเบื้องหลัง\", \"โครงสร้างและเนื้อดินที่ต้องการ\", \"การระบายน้ำ: ปัจจัยที่ตัดสินความอยู่รอด\", \"การทดสอบดินก่อนปลูก\", \"การปรับปรุงดินที่ไม่เหมาะ\", \"ความเค็มของดินและน้ำ\", \"การคลุมโคนที่ทำได้จริง\"],\n    body: [\n      { h: \"pH ที่เหมาะและเหตุผลเบื้องหลัง\", p: \"แหล่งวิชาการให้ช่วงที่ใกล้เคียงกัน โดยรวมอยู่ราว pH 5.5–7.0 และช่วงที่หลายแหล่งระบุว่าเหมาะที่สุดคือ 6.0–6.5 เหตุผลอยู่ที่ความสามารถในการดูดธาตุอาหาร ดินที่เป็นด่างเกินไปจะล็อกธาตุเหล็กและสังกะสีไว้จนต้นแสดงอาการใบเหลืองระหว่างเส้นใบ ขณะที่ดินที่เป็นกรดจัดเกินจะทำให้ฟอสฟอรัสและแคลเซียมใช้ประโยชน์ได้น้อยลง การปรับ pH ต้องทำก่อนปลูก เพราะการปรับหลังปลูกทำได้จำกัดและใช้เวลาหลายเดือนจึงเห็นผล\" },\n      { h: \"โครงสร้างและเนื้อดินที่ต้องการ\", p: \"ดินที่ดีที่สุดสำหรับอโวคาโด้คือดินร่วนปนทรายที่โปร่ง ระบายน้ำเร็ว แต่ยังอุ้มความชื้นได้พอ เอกสารทางการผลิตระบุว่าดินร่วนปนทรายที่มีดินเหนียวราว 20–40% ให้ผลดี ชั้นดินควรลึกพอให้รากแผ่ ราวหนึ่งเมตรขึ้นไป จุดที่ต้องเข้าใจคือรากดูดอาหารส่วนใหญ่ของอโวคาโด้กระจุกอยู่ในดินชั้นบนราว 50 เซนติเมตร ในรัศมี 1–1.25 เมตรจากโคน ดินชั้นบนจึงสำคัญกว่าดินชั้นลึก และการไถพรวนลึกใกล้โคนเป็นสิ่งที่ควรเลี่ยง\" },\n      { h: \"การระบายน้ำ: ปัจจัยที่ตัดสินความอยู่รอด\", p: \"อโวคาโด้ไวต่อสภาพน้ำขังอย่างมากเพราะรากต้องการออกซิเจนสูง เมื่อดินอิ่มน้ำนานเกินไป รากขาดอากาศและอ่อนแอลง เปิดทางให้เชื้อ Phytophthora เข้าทำลาย ทางแก้เชิงโครงสร้างมีสามอย่างที่ทำได้จริง หนึ่ง — ยกโคกปลูกให้สูงกว่าระดับพื้น สอง — ขุดร่องระบายน้ำระหว่างแถวและเบนทางน้ำผิวดินออกจากแปลง สาม — ไม่ทำงานในแปลงขณะดินเปียกจัด เพราะการเหยียบย่ำและล้อรถทำให้ดินอัดแน่นและพาเชื้อกระจายไปทั่ว\" },\n      { h: \"การทดสอบดินก่อนปลูก\", p: \"ควรตรวจอย่างน้อยสามอย่างก่อนลงทุน คือ pH ความเค็ม (EC) และเนื้อดิน ชุดตรวจ pH ราคาไม่แพงหาซื้อได้ทั่วไป แต่ถ้าจะปลูกเป็นแปลงใหญ่ควรส่งตัวอย่างดินให้ห้องปฏิบัติการหรือสำนักงานเกษตรในพื้นที่วิเคราะห์ เก็บตัวอย่างจากหลายจุดในแปลงที่ความลึก 0–30 และ 30–60 เซนติเมตร แล้วผสมรวมตามชั้น เพราะดินในแปลงเดียวมักไม่สม่ำเสมอ และควรตรวจคุณภาพน้ำที่จะใช้รดด้วย โดยเฉพาะเรื่องความเค็มและความเป็นด่าง\" },\n      { h: \"การปรับปรุงดินที่ไม่เหมาะ\", p: \"ดินเหนียวจัด — เพิ่มอินทรียวัตถุที่ย่อยสลายแล้วและวัสดุที่ทำให้โปร่ง ร่วมกับการยกโคกหรือทำแปลงยกร่อง อย่าหวังว่าจะเปลี่ยนเนื้อดินทั้งแปลงได้ ให้จัดการที่ระดับหลุมปลูกและการระบายน้ำ ดินเป็นด่าง — ใช้กำมะถันผงหรือวัสดุที่ให้ผลเป็นกรด แต่ต้องวางแผนล่วงหน้าเพราะการปรับ pH ใช้เวลาหลายเดือน ดินทรายจัด — เพิ่มอินทรียวัตถุเพื่อช่วยอุ้มน้ำและธาตุอาหาร และให้น้ำถี่ขึ้นแต่ครั้งละน้อยลง เพราะดินทรายอุ้มน้ำได้น้อยและน้ำเคลื่อนตัวด้านข้างได้จำกัด\" },\n      { h: \"ความเค็มของดินและน้ำ\", p: \"เอกสารของ UC ANR ระบุว่าอโวคาโด้เป็นไม้ผลที่ไวต่อเกลือและความแล้งมากที่สุดกลุ่มหนึ่ง และในปีที่ฝนน้อย แม้แปลงที่ให้น้ำดีก็ยังแสดงอาการเกลือทำลาย เพราะฝนคือกลไกหลักที่ชะเกลือออกจากเขตราก อาการที่สังเกตได้คือปลายใบและขอบใบไหม้แห้งเป็นสีน้ำตาล ในพื้นที่ที่น้ำมีเกลือสูง ต้องให้น้ำเกินความต้องการของพืชในสัดส่วนหนึ่งเพื่อชะเกลือลงใต้เขตราก และการคลุมโคนช่วยลดผลกระทบจากดินและน้ำที่มีเกลือได้\" },\n      { h: \"การคลุมโคนที่ทำได้จริง\", p: \"UC IPM แนะนำให้ใช้วัสดุคลุมอินทรีย์เนื้อหยาบ เช่น เศษกิ่งอโวคาโด้ที่ตัดแต่ง เศษวัสดุพืชที่หมักแล้ว หรือชิ้นไม้เนื้อแข็ง ซึ่งควบคุม Phytophthora ได้ดีกว่าใบที่ร่วงเองตามธรรมชาติ เหตุผลคือวัสดุคลุมส่งเสริมให้รากเจริญขึ้นมาในชั้นวัสดุ เพิ่มจุลินทรีย์ที่เป็นปฏิปักษ์กับเชื้อ และลดผลกระทบจากดินและน้ำที่มีเกลือ ในทางปฏิบัติให้คลุมหนาราว 10–15 เซนติเมตรรอบทรงพุ่ม แต่เว้นบริเวณโคนต้นไว้เพื่อไม่ให้โคนอับชื้น\" }\n    ] },\n\n  { tag: \"การให้น้ำ\", read: 10, title: \"การรดน้ำอโวคาโด้ที่ถูกต้อง: ความถี่ ปริมาณ และการปรับตามฤดู\",\n    excerpt: \"ตัวเลขการใช้น้ำจริง วิธีตรวจความชื้นดิน สัญญาณน้ำเกินน้ำขาด และการเลือกระบบน้ำ\",\n    author: \"ทีมวิชาการ Avocado Geek\", date: \"31 ก.ค. 2569\", imageNote: \"หัวน้ำหยดรอบทรงพุ่ม\",\n    keywords: [\"รดน้ำอโวคาโด้\", \"ความถี่รดน้ำอโวคาโด้\", \"ปริมาณน้ำอโวคาโด้\", \"อโวคาโด้ใบเหลือง น้ำเกิน\"],\n    toc: [\"ทำไมอโวคาโด้จัดการน้ำยากกว่าไม้ผลอื่น\", \"ปริมาณน้ำที่ต้นต้องการจริง\", \"ความถี่ที่เหมาะกับแต่ละอายุต้น\", \"วิธีตรวจความชื้นดินก่อนรด\", \"สัญญาณน้ำขาดและน้ำเกิน\", \"การปรับตามฤดูในบริบทไทย\", \"เลือกระบบน้ำแบบไหน\"],\n    body: [\n      { h: \"ทำไมอโวคาโด้จัดการน้ำยากกว่าไม้ผลอื่น\", p: \"เพราะมันต้องการทั้งความชื้นสม่ำเสมอและอากาศในดินไปพร้อมกัน UC ANR ระบุว่ารากอโวคาโด้อยู่ตื้น ส่วนใหญ่กระจุกในดินชั้นบนราวหนึ่งฟุต จึงไม่สามารถดึงน้ำที่เก็บอยู่ในดินชั้นลึกมาใช้ได้ ผลคือมันทนแล้งได้ต่ำกว่าไม้ผลทั่วไป แต่ในเวลาเดียวกันการให้น้ำมากเกินไปก็ทำให้รากขาดออกซิเจนและเปิดทางให้โรครากและโคนเน่า ช่วงที่ถูกต้องจึงแคบ และการ 'รดเผื่อไว้' เป็นความผิดพลาดที่พบบ่อยที่สุด\" },\n      { h: \"ปริมาณน้ำที่ต้นต้องการจริง\", p: \"ในระดับปี แหล่งข้อมูลของแคลิฟอร์เนียระบุว่าอโวคาโด้ต้องการน้ำเทียบเท่าฝนราว 1,000–1,300 มิลลิเมตรต่อปีจึงจะให้ผลผลิตดี ในระดับสัปดาห์ UC IPM ให้ตัวเลขว่าช่วงร้อนที่สุดของฤดูร้อน ต้นที่ให้ผลแล้วต้องการน้ำราว 2 นิ้วต่อสัปดาห์ ในระดับต้น UC Master Gardeners ให้กฎง่ายๆ ว่าต้นโตเต็มที่ใช้น้ำราว 20 แกลลอนต่อวันในฤดูให้น้ำ ขณะที่ต้นที่ปลูกใหม่ใช้ราว 1 แกลลอนต่อวันในสภาพอากาศชายฝั่ง ตัวเลขเหล่านี้ต่างกันตามภูมิอากาศ ให้ใช้เป็นกรอบแล้วปรับด้วยการวัดความชื้นดินจริง\" },\n      { h: \"ความถี่ที่เหมาะกับแต่ละอายุต้น\", p: \"ต้นปลูกใหม่ถึงหกเดือน — สัปดาห์ละ 2–3 ครั้ง ครั้งละไม่มาก เพราะตุ้มรากยังเล็กและอุ้มน้ำได้จำกัด สิ้นปีแรก — ลดลงเหลือราวสัปดาห์ละครั้ง เมื่อรากแผ่ออกไปในดินรอบข้างแล้วให้เพิ่มปริมาณต่อครั้งแทนการเพิ่มความถี่ ต้นให้ผลแล้ว — ในฤดูร้อนจัด แนวปฏิบัติในเขตอากาศร้อนคือรดรอบละลึกทุก 7–10 วัน แต่บนดินทรายต้องถี่กว่านั้นและปริมาณต่อครั้งน้อยกว่า ที่ต้องแยกให้ชัดคือต้นเล็กและต้นใหญ่ควรอยู่ในระบบน้ำแยกกัน เพราะความต้องการต่างกันหลายเท่า\" },\n      { h: \"วิธีตรวจความชื้นดินก่อนรด\", p: \"วิธีที่ไม่ต้องใช้อุปกรณ์ — ขุดดินลึกราว 15–20 เซนติเมตรในเขตราก กำดินขึ้นมาแล้วบีบ ถ้าดินจับตัวคงรูปตามมือได้ แสดงว่าความชื้นยังพอ ยังไม่ต้องรด ถ้าดินร่วนแตกออกทันทีคือแห้งแล้ว วิธีที่แม่นกว่า — ใช้เทนซิโอมิเตอร์ที่ระดับ 12 และ 24 นิ้ว แนวปฏิบัติของสวนในแคลิฟอร์เนียคือเริ่มให้น้ำเมื่อค่าที่ 12 นิ้วอ่านได้ราว 25–30 เซนติบาร์ โดยเริ่มเร็วกว่านั้นถ้าดินเป็นทรายจัด และช้ากว่านั้นถ้าดินมีดินเหนียวสูง\" },\n      { h: \"สัญญาณน้ำขาดและน้ำเกิน\", p: \"น้ำขาด — ผลเล็กกว่าปกติและเสี่ยงไหม้แดด ปลายใบและขอบใบแห้งกรอบสีน้ำตาลจากเกลือที่ไม่ถูกชะออก ใบร่วงในช่วงออกดอกเพราะดอกกับใบแย่งน้ำกัน น้ำเกิน — ใบเหลืองซีดและเล็กลง ใบเหี่ยวแม้ดินยังเปียก ซึ่งเป็นอาการเด่นของโรครากเน่าตามที่ UC IPM ระบุ กิ่งเล็กแห้งตายในทรงพุ่มจนกิ่งใหญ่โดนแดดไหม้ และมักไม่มีชั้นใบร่วงคลุมใต้ต้น จุดสังเกตสำคัญคือถ้าใบเหี่ยวแต่ดินเปียก ปัญหาคือรากไม่ใช่การขาดน้ำ\" },\n      { h: \"การปรับตามฤดูในบริบทไทย\", p: \"หน้าแล้ง (ก.พ.–พ.ค.) — ช่วงที่ต้องการน้ำมากที่สุดและตรงกับช่วงติดผลอ่อนของหลายสายพันธุ์ การขาดน้ำช่วงนี้ทำให้ผลร่วงชัดเจน ให้รดสม่ำเสมอและคลุมโคนไว้ หน้าฝน (มิ.ย.–ต.ค.) — งดให้น้ำเมื่อฝนเพียงพอ และเปลี่ยนโฟกัสไปที่การระบายน้ำออกจากแปลงให้เร็ว เพราะช่วงนี้คือช่วงที่โรครากเน่าระบาดหนักที่สุด หน้าหนาว (พ.ย.–ม.ค.) — ความต้องการน้ำลดลงตามอุณหภูมิ ให้ลดปริมาณลงแต่ไม่ปล่อยให้แห้งจัดในช่วงที่ต้นเริ่มสร้างตาดอก\" },\n      { h: \"เลือกระบบน้ำแบบไหน\", p: \"น้ำหยดหลายหัวต่อต้นหรือมินิสปริงเกลอร์เป็นตัวเลือกที่แนะนำ เพราะกระจายน้ำได้สม่ำเสมอในเขตรากตื้นและควบคุมปริมาณได้แม่น UC IPM แนะนำ 2–4 หัวต่อต้นหรือใช้หัวพ่นละอองขนาดเล็ก โดยวางให้เปียกทั่วบริเวณทรงพุ่ม ไม่ใช่แค่จุดเดียวใกล้โคน สิ่งที่ต้องเลี่ยงคือการให้น้ำที่ทำให้โคนต้นเปียกอยู่เสมอ และน้ำที่ไหลบ่าออกนอกแปลง ตรวจหัวน้ำที่อุดตันและวัดอัตราการไหลจริงต่อต้นอย่างน้อยปีละครั้งก่อนเข้าหน้าแล้ง\" }\n    ] },\n\n  { tag: \"ปัญหา\", read: 12, title: \"ปัญหาปลูกอโวคาโด้ที่พบบ่อย: โรค แมลงศัตรู และวิธีแก้ไข\",\n    excerpt: \"รากเน่า แอนแทรคโนส เพลี้ยไฟ ไร และอาการขาดธาตุ พร้อมแนวทางจัดการแบบผสมผสาน\",\n    author: \"ทีมวิชาการ Avocado Geek\", date: \"28 ก.ค. 2569\", imageNote: \"ใบและผลที่แสดงอาการโรค\",\n    keywords: [\"โรคอโวคาโด้\", \"ปัญหาปลูกอโวคาโด้\", \"รากเน่าอโวคาโด้\", \"แมลงศัตรูอโวคาโด้\"],\n    toc: [\"โรครากเน่า: ปัญหาอันดับหนึ่ง\", \"โคนเน่าและแคงเกอร์ที่ลำต้น\", \"แอนแทรคโนสและโรคผลเน่า\", \"เพลี้ยไฟและไร\", \"อาการขาดธาตุอาหาร\", \"ผลร่วงและติดผลน้อย\", \"หลักการจัดการแบบผสมผสาน\"],\n    body: [\n      { h: \"โรครากเน่า: ปัญหาอันดับหนึ่ง\", p: \"UC IPM ระบุชัดว่าโรครากเน่าจากเชื้อ Phytophthora cinnamomi เป็นโรคที่ร้ายแรงที่สุดของอโวคาโด้ เชื้อนี้เป็นโอโอไมซีตหรือราน้ำ ไม่ใช่ราแท้ และมีพืชอาศัยมากกว่าหนึ่งพันชนิด อาการทางใบคือใบเล็กลง สีเขียวซีดหรือเหลือง เหี่ยวและปลายใบแห้งเป็นสีน้ำตาลแม้ดินยังชื้น ทรงพุ่มโปร่ง แตกยอดใหม่น้อย กิ่งเล็กแห้งตายจนกิ่งใหญ่โดนแดดไหม้ และมักไม่มีชั้นใบร่วงใต้ต้น หลายกรณีต้นจะให้ผลดกแต่ผลเล็กก่อนตาย รากดูดอาหารที่ติดเชื้อจะเปลี่ยนจากสีขาวซีดเป็นดำ\" },\n      { h: \"การจัดการโรครากเน่า\", p: \"แนวทางที่ UC IPM เน้นคือการป้องกันมาก่อนการรักษา หนึ่ง — ใช้ต้นพันธุ์ที่ตรวจสอบแหล่งที่มาได้และเลือกต้นตอที่ทนโรค ต้นตอที่ผลิตแบบโคลนจากพันธุ์ที่แนะนำจะทนกว่าต้นตอเพาะเมล็ด แต่ไม่มีต้นตอใดที่ภูมิคุ้มกันสมบูรณ์ สอง — สุขอนามัยในแปลง อย่าให้ดินหรือน้ำจากบริเวณที่เป็นโรคไหลเข้าบริเวณที่ยังดี ติดตั้งรางระบายกันน้ำไหลข้าม สาม — คลุมโคนด้วยวัสดุอินทรีย์เนื้อหยาบและใช้ยิปซัมซึ่งให้แคลเซียมที่ช่วยยับยั้งการสร้างสปอร์ สี่ — ให้ไนโตรเจนในระดับพอเหมาะเพื่อให้ต้นแข็งแรงพอทนโรค แต่เลี่ยงปุ๋ยที่มีแอมโมเนียหรือเกลือสูง\" },\n      { h: \"โคนเน่าและแคงเกอร์ที่ลำต้น\", p: \"เชื้อ Phytophthora อีกชนิดหนึ่งคือ P. mengei (ชื่อเดิม P. citricola) ทำให้เกิดแคงเกอร์ที่โคนลำต้นและคอราก ซึ่งพบเกิดร่วมกับโรครากเน่าในต้นเดียวกันได้ อาการที่สังเกตได้คือรอยแผลเปลือกที่มีของเหลวสีขาวหรือน้ำตาลไหลซึม เมื่อแกะเปลือกจะเห็นเนื้อเยื่อใต้เปลือกเปลี่ยนสี ปัจจัยส่งเสริมคือโคนต้นเปียกอยู่เสมอจากการให้น้ำหรือดินกลบสูงเกิน การป้องกันคือปลูกให้โคนสูง อย่ารดน้ำโดนโคน และอย่ากลบดินหรือวัสดุคลุมทับโคนต้น\" },\n      { h: \"แอนแทรคโนสและโรคผลเน่า\", p: \"แอนแทรคโนสเป็นโรคที่แสดงอาการชัดเจนที่สุดตอนใกล้เก็บเกี่ยวและหลังเก็บ โดยเกิดเป็นจุดหรือแผลสีดำยุบตัวบนผิวผลและลุกลามเข้าเนื้อเมื่อผลเริ่มสุก เชื้อเข้าทำลายผ่านบาดแผลและสภาพชื้น การจัดการที่ได้ผลจริงคือลดความชื้นในทรงพุ่มด้วยการตัดแต่งให้โปร่ง เก็บผลอย่างระวังไม่ให้เกิดบาดแผลและเหลือก้านสั้นติดผลเพื่อลดช่องทางเข้าของเชื้อ ลดเวลาระหว่างเก็บถึงการทำความเย็น และกำจัดผลร่วงผลเน่าออกจากแปลง เพราะเป็นแหล่งเชื้อสำหรับฤดูถัดไป\" },\n      { h: \"เพลี้ยไฟและไร\", p: \"เพลี้ยไฟทำลายผิวผลอ่อนทำให้เกิดรอยกร้านเป็นแผ่นสีน้ำตาล ซึ่งไม่กระทบรสชาติแต่ทำให้ผลตกเกรดและขายได้ราคาต่ำลง ไรสนิมและไรแดงทำให้ใบด่างซีดและร่วงในกรณีที่ระบาดหนัก UC IPM ระบุว่าการคลุมวัสดุอินทรีย์เนื้อหยาบหนาราว 6 นิ้วอาจลดการอยู่รอดของเพลี้ยไฟที่ทิ้งตัวลงดินเพื่อเข้าดักแด้ แม้ประสิทธิภาพยังไม่แน่ชัดและอาจไม่คุ้มค่าแรงถ้าทำเพื่อคุมเพลี้ยไฟเพียงอย่างเดียว หลักปฏิบัติที่สำคัญกว่าคือสำรวจแปลงสม่ำเสมอ อนุรักษ์ศัตรูธรรมชาติ และหลีกเลี่ยงการพ่นสารในช่วงดอกบานเพราะเป็นพิษต่อแมลงผสมเกสร\" },\n      { h: \"อาการขาดธาตุอาหาร\", p: \"อาการที่พบบ่อยที่สุดในไทยคือใบเหลืองระหว่างเส้นใบขณะที่เส้นใบยังเขียว ซึ่งมักเป็นการขาดธาตุเหล็กหรือสังกะสีที่เกิดจากดินเป็นด่างเกินไป ไม่ใช่เพราะดินไม่มีธาตุนั้น การแก้จึงต้องแก้ที่ pH ไม่ใช่เพียงเติมธาตุ อาการปลายใบและขอบใบแห้งไหม้เป็นสีน้ำตาลมักเป็นพิษจากเกลือหรือคลอไรด์ ไม่ใช่การขาดธาตุ ซึ่งแก้ด้วยการชะเกลือและปรับคุณภาพน้ำ วิธีวินิจฉัยที่แม่นกว่าการเดาคือการวิเคราะห์ใบร่วมกับการวิเคราะห์ดิน\" },\n      { h: \"ผลร่วงและติดผลน้อย\", p: \"การร่วงของผลอ่อนบางส่วนเป็นเรื่องปกติตามธรรมชาติ ต้นโตเต็มที่สามารถออกดอกได้มากกว่าหนึ่งล้านดอกในหนึ่งฤดู แต่ติดผลจริงเพียงส่วนน้อยมาก ปัญหาที่ควรตรวจคือสี่ข้อ หนึ่ง — ไม่มีพันธุ์ผสมเกสรที่ชนิดดอกเสริมกันในระยะใกล้ สอง — น้ำไม่สม่ำเสมอในช่วงติดผลอ่อน สาม — อุณหภูมิผิดปกติช่วงดอกบาน เพราะงานวิจัยพบว่าอุณหภูมิที่สูงหรือต่ำเกินรบกวนวงจรดอกและการเจริญของหลอดละอองเรณู สี่ — ขาดแคลเซียมและโบรอน ให้ตรวจทั้งสี่ปัจจัยก่อนตัดสินใจใช้สารกระตุ้นการติดผล\" },\n      { h: \"หลักการจัดการแบบผสมผสาน\", p: \"ลำดับที่ควรทำเสมอคือ ป้องกัน → สำรวจ → วินิจฉัย → จัดการ ป้องกันด้วยการเลือกพื้นที่และต้นพันธุ์ที่ถูกต้องตั้งแต่ต้น สำรวจแปลงเป็นรอบสม่ำเสมอเพื่อพบอาการในระยะแรกซึ่งยังแก้ทันเกือบทุกกรณี วินิจฉัยให้แน่ก่อนพ่นสาร เพราะอาการใบเหลืองอาจมาจากรากเน่า ขาดธาตุ หรือเกลือ ซึ่งวิธีแก้ต่างกันโดยสิ้นเชิง และเมื่อต้องใช้สารเคมี ให้สลับกลุ่มสารเพื่อลดการดื้อ ปฏิบัติตามฉลาก และแก้ปัจจัยแวดล้อมที่เป็นต้นเหตุควบคู่กันไปเสมอ\" }\n    ] },\n\n  { tag: \"การขยายพันธุ์\", read: 9, title: \"ปลูกอโวคาโด้จากเมล็ด: ขั้นตอน ระยะเวลา ข้อดีข้อเสียที่ต้องรู้ก่อน\",\n    excerpt: \"วิธีเพาะที่ได้ผล ระยะเวลาจริงจนติดผล และเหตุผลที่ผลจะไม่เหมือนต้นแม่\",\n    author: \"ทีมวิชาการ Avocado Geek\", date: \"25 ก.ค. 2569\", imageNote: \"เมล็ดงอกและต้นกล้าในถุงชำ\",\n    keywords: [\"ปลูกอโวคาโด้จากเมล็ด\", \"เพาะเมล็ดอโวคาโด้\", \"เมล็ดอโวคาโด้ปลูก\", \"ต้นกล้าอโวคาโด้\"],\n    toc: [\"ความจริงข้อแรกที่ต้องยอมรับ\", \"เลือกและเตรียมเมล็ด\", \"วิธีเพาะที่ได้ผลจริง\", \"การดูแลต้นกล้า\", \"ระยะเวลาที่ต้องรอจริง\", \"ข้อดีของการเพาะเมล็ด\", \"ใช้ต้นเพาะเมล็ดเป็นต้นตอ\"],\n    body: [\n      { h: \"ความจริงข้อแรกที่ต้องยอมรับ\", p: \"อโวคาโด้ผสมข้ามพันธุ์เป็นหลัก ต้นที่ได้จากเมล็ดจึงเป็นลูกผสมที่มีพันธุกรรมไม่เหมือนต้นแม่ ผลที่ได้จะต่างออกไปทั้งขนาด รูปทรง ปริมาณน้ำมัน รสชาติ และช่วงเก็บเกี่ยว บางต้นดีกว่าต้นแม่ แต่ส่วนใหญ่ด้อยกว่าในเชิงการค้า นี่คือเหตุผลที่สวนการค้าทั่วโลกใช้ต้นเสียบยอดหรือทาบกิ่งเท่านั้น ไม่ใช้ต้นเพาะเมล็ดปลูกเพื่อเก็บผล การเพาะเมล็ดจึงควรทำด้วยเป้าหมายสองอย่าง คือเรียนรู้และสนุก หรือเพื่อผลิตต้นตอ ไม่ใช่เพื่อหวังผลผลิตที่คาดการณ์ได้\" },\n      { h: \"เลือกและเตรียมเมล็ด\", p: \"ใช้เมล็ดจากผลที่สุกดีและสมบูรณ์ ไม่ใช่ผลที่เน่าหรือช้ำ เมล็ดอโวคาโด้สูญเสียความงอกเร็วเมื่อแห้ง จึงควรเพาะภายในไม่กี่วันหลังผ่าผล ล้างเนื้อที่ติดออกให้หมดเพราะเนื้อที่เหลือเป็นแหล่งเชื้อรา ไม่ต้องแกะเปลือกหุ้มเมล็ดออกทั้งหมด แต่การเฉือนปลายด้านบนเล็กน้อยช่วยให้ยอดแทงออกง่ายขึ้นในบางกรณี สังเกตทิศทางให้ถูก ด้านที่แบนกว่าและกว้างกว่าคือด้านล่างที่จะออกราก ด้านที่แหลมกว่าคือด้านบนที่จะแตกยอด\" },\n      { h: \"วิธีเพาะที่ได้ผลจริง\", p: \"วิธีที่ให้อัตรารอดดีกว่าการปักไม้จิ้มฟันแช่น้ำคือการเพาะในวัสดุปลูกโดยตรง ใช้ถุงชำหรือกระถางที่มีรูระบายน้ำ วัสดุปลูกที่โปร่งระบายน้ำเร็ว เช่น ดินร่วนผสมแกลบดิบหรือขุยมะพร้าว ฝังเมล็ดโดยให้ส่วนบนโผล่พ้นวัสดุประมาณหนึ่งในสาม รักษาความชื้นสม่ำเสมอแต่ไม่แฉะ วางในที่ร่มรำไรอุ่นๆ ไม่ตากแดดจัด เมล็ดมักเริ่มแตกรากภายใน 2–6 สัปดาห์และแตกยอดตามมา วิธีแช่น้ำเห็นรากได้ชัดและสนุกกว่า แต่รากที่เกิดในน้ำจะอ่อนแอและช็อกเมื่อย้ายลงดิน\" },\n      { h: \"การดูแลต้นกล้า\", p: \"ให้แสงรำไรในช่วงแรกแล้วค่อยเพิ่มแสงทีละน้อยจนได้แดดเต็มวันเมื่อต้นแข็งแรง รดน้ำเมื่อผิววัสดุเริ่มแห้ง ไม่รดทุกวันตามตาราง เพราะวัสดุที่แฉะทำให้รากเน่าซึ่งเป็นสาเหตุการตายอันดับหนึ่งของต้นกล้า เริ่มให้ปุ๋ยเจือจางมากได้เมื่อต้นมีใบแท้ 4–6 ใบ เมื่อต้นสูงราว 30 เซนติเมตร การเด็ดยอดจะช่วยให้แตกกิ่งข้างและทรงพุ่มแน่นขึ้นแทนที่จะยืดสูงเป็นเสาเดียว และย้ายลงภาชนะใหญ่ขึ้นเมื่อรากเริ่มขดที่ก้น\" },\n      { h: \"ระยะเวลาที่ต้องรอจริง\", p: \"ต้นที่ปลูกจากเมล็ดโดยทั่วไปใช้เวลาราว 5–8 ปีหรือมากกว่านั้นจึงเริ่มติดผล บางต้นอาจไม่ให้ผลที่มีคุณภาพเลย เทียบกับต้นเสียบยอดหรือทาบกิ่งที่มักเริ่มให้ผลภายในราว 3–4 ปีและให้ผลตรงตามสายพันธุ์ ความต่างนี้ไม่ใช่เรื่องเล็ก เพราะหมายถึงเวลา 3–5 ปีที่ต่างกันบวกกับความไม่แน่นอนของคุณภาพผล สำหรับผู้ที่ต้องการเก็บผลจริงจัง การจ่ายเพิ่มเพื่อต้นเสียบยอดคุ้มกว่าเกือบทุกกรณี\" },\n      { h: \"ข้อดีของการเพาะเมล็ด\", p: \"ต้นทุนแทบเป็นศูนย์เพราะเมล็ดมาจากผลที่กินอยู่แล้ว เป็นกิจกรรมเรียนรู้ที่ดีสำหรับผู้เริ่มต้นและเด็ก ทำให้เข้าใจพฤติกรรมของต้นอโวคาโด้ตั้งแต่ระยะแรก ต้นที่ได้แข็งแรงและมีระบบรากที่พัฒนาในที่ที่มันอยู่จริง และในเชิงปฏิบัติสำคัญที่สุด — ต้นเพาะเมล็ดคือวัตถุดิบสำหรับทำต้นตอ ซึ่งเป็นก้าวแรกของการผลิตต้นพันธุ์ดีด้วยตัวเอง หลายคนที่เริ่มจากความสนุกจึงต่อยอดไปเป็นการทาบกิ่งได้\" },\n      { h: \"ใช้ต้นเพาะเมล็ดเป็นต้นตอ\", p: \"นี่คือทางที่คุ้มค่าที่สุดสำหรับต้นเพาะเมล็ด เลี้ยงต้นกล้าในถุงชำต่อไปจนอายุราว 8–12 เดือน ลำต้นตรง เส้นผ่านศูนย์กลางใกล้เคียงดินสอ แล้วจึงนำไปเสียบยอดหรือทาบด้วยกิ่งพันธุ์ดี ผลที่ได้คือต้นที่มีรากจากต้นตอที่ปรับตัวกับดินในพื้นที่ และมียอดที่ให้ผลตรงตามสายพันธุ์ ข้อควรรู้คือต้นตอเพาะเมล็ดมีความทนโรคไม่สม่ำเสมอ ต่างจากต้นตอโคลนที่คัดคุณสมบัติมาแล้ว จึงควรบันทึกไว้ว่าต้นตอของคุณเพาะจากเมล็ดพันธุ์อะไร เพื่อเทียบผลในระยะยาว\" }\n    ] },\n\n  { tag: \"เทคนิค\", read: 11, title: \"เทคนิคเสียบยอดและทาบกิ่งอโวคาโด้: วิธี จังหวะเวลา และการดูแลหลังทำ\",\n    excerpt: \"เลือกกิ่งพันธุ์และต้นตอ ขั้นตอนการเสียบยอด การพันแผล และการตรวจรอยต่อ\",\n    author: \"ทีมวิชาการ Avocado Geek\", date: \"22 ก.ค. 2569\", imageNote: \"รอยต่อที่พันพลาสติกใส\",\n    keywords: [\"เสียบยอดอโวคาโด้\", \"ทาบกิ่งอโวคาโด้\", \"grafting avocado\", \"ขยายพันธุ์อโวคาโด้\"],\n    toc: [\"ทำไมต้องเสียบยอด\", \"เข้าใจสองส่วน: ต้นตอและกิ่งพันธุ์\", \"เตรียมต้นตอให้พร้อม\", \"เลือกและเก็บกิ่งพันธุ์\", \"จังหวะเวลาที่เหมาะ\", \"ขั้นตอนการเสียบยอด\", \"การดูแลหลังเสียบยอด\", \"สาเหตุที่รอยต่อไม่ติด\"],\n    body: [\n      { h: \"ทำไมต้องเสียบยอด\", p: \"เหตุผลมีสองข้อที่ตอบโจทย์ต่างกัน ข้อแรก — ได้ผลตรงตามสายพันธุ์ เพราะกิ่งพันธุ์เป็นเนื้อเยื่อเดียวกับต้นแม่ทางพันธุกรรม ต่างจากต้นเพาะเมล็ดที่พันธุกรรมผสมใหม่ ข้อสอง — ให้ผลเร็วกว่า โดยทั่วไปเริ่มให้ผลในราว 3–4 ปีเทียบกับ 5–8 ปีของต้นเพาะเมล็ด นอกจากนี้การเสียบยอดยังทำให้เลือกต้นตอที่ทนโรครากเน่าหรือทนดินเค็มได้ แยกจากการเลือกยอดที่ให้ผลดี ซึ่งเป็นข้อได้เปรียบที่ต้นเพาะเมล็ดทำไม่ได้\" },\n      { h: \"เข้าใจสองส่วน: ต้นตอและกิ่งพันธุ์\", p: \"ต้นตอ (rootstock) คือส่วนล่างที่ให้ระบบรากและกำหนดความทนทานต่อดิน โรค และความเค็ม UC IPM ระบุว่าควรเลือกต้นตอที่ทนโรครากเน่า และต้นตอที่ผลิตแบบโคลนจากพันธุ์ที่แนะนำจะทนกว่าต้นตอที่เพาะจากเมล็ด กิ่งพันธุ์ (scion) คือส่วนบนที่กำหนดสายพันธุ์ของผล ทั้งรสชาติ ขนาด ฤดูเก็บเกี่ยว และชนิดดอก การจับคู่ที่ดีจึงหมายถึงต้นตอที่เหมาะกับดินของคุณ ประกอบกับยอดที่เหมาะกับตลาดของคุณ\" },\n      { h: \"เตรียมต้นตอให้พร้อม\", p: \"ใช้ต้นตออายุราว 8–12 เดือน ลำต้นตรง แข็งแรง ไม่มีอาการโรค เส้นผ่านศูนย์กลางใกล้เคียงกับกิ่งพันธุ์ที่จะใช้ เพราะขนาดที่เท่ากันทำให้แผลสองฝั่งประกบสนิทและเนื้อเยื่อเชื่อมกันได้ดี รดน้ำต้นตอให้ชุ่มหนึ่งวันก่อนทำ เพื่อให้ต้นอยู่ในสภาพเจริญเติบโตและเนื้อเยื่อเชื่อมเร็ว ต้นตอที่ขาดน้ำหรือกำลังเครียดจะให้อัตราการติดต่ำลงชัดเจน\" },\n      { h: \"เลือกและเก็บกิ่งพันธุ์\", p: \"เลือกกิ่งกึ่งอ่อนกึ่งแก่จากต้นแม่ที่ให้ผลมาแล้วอย่างน้อยสองฤดูและรู้ประวัติชัดเจนว่าเป็นสายพันธุ์อะไร ตาที่สมบูรณ์และไม่แตกยอดอ่อนจัด ขนาดใกล้เคียงดินสอ ตัดใบออกให้เหลือเพียงก้านใบเพื่อลดการคายน้ำ ถ้ายังไม่ทำทันทีให้ห่อด้วยผ้าหรือกระดาษชุบน้ำหมาดและเก็บในที่เย็น ใช้ภายใน 1–2 วันเพื่อความปลอดภัย กิ่งพันธุ์ที่แห้งไปแล้วแม้เพียงเล็กน้อยจะไม่ติด และควรบันทึกว่ากิ่งมาจากต้นแม่ต้นไหน เพื่อให้ตรวจย้อนหลังได้เมื่อผลออก\" },\n      { h: \"จังหวะเวลาที่เหมาะ\", p: \"ทำในช่วงที่ต้นกำลังเจริญเติบโตแต่อากาศไม่ร้อนจัดและไม่ใช่ช่วงฝนชุก เพราะความชื้นที่มากเกินทำให้แผลเน่า ในไทยช่วงที่ทำได้ดีคือปลายหนาวถึงต้นฝน เลือกทำในช่วงเช้าที่อุณหภูมิยังไม่สูง หลีกเลี่ยงวันที่ฝนตกหรือกำลังจะตก เพราะน้ำที่ซึมเข้าแผลเป็นสาเหตุการล้มเหลวที่พบบ่อยที่สุด\" },\n      { h: \"ขั้นตอนการเสียบยอด\", p: \"ใช้มีดที่คมจริงและสะอาด เช็ดใบมีดด้วยแอลกอฮอล์ก่อนทำและระหว่างเปลี่ยนต้น เฉือนแผลยาวราว 4–5 เซนติเมตรทั้งบนต้นตอและกิ่งพันธุ์ให้เป็นระนาบเรียบในการเฉือนครั้งเดียว ไม่เฉือนซ้ำหลายครั้งเพราะผิวแผลที่ขรุขระจะไม่ประกบสนิท ประกบให้ชั้นเนื้อเยื่อเจริญของทั้งสองฝั่งแนบกัน แล้วพันด้วยพลาสติกใสหรือเทปพันกิ่งจากล่างขึ้นบนอย่างแน่นและซ้อนกันไม่ให้น้ำเข้า พันคลุมกิ่งพันธุ์ทั้งหมดเพื่อรักษาความชื้นภายในไว้ ยกเว้นบริเวณตาที่จะแตกยอด\" },\n      { h: \"การดูแลหลังเสียบยอด\", p: \"วางต้นในที่ร่มรำไรราว 50–60% ไม่ให้แดดส่องแผลโดยตรง และไม่ให้น้ำโดนรอยต่อ รักษาความชื้นในวัสดุปลูกให้สม่ำเสมอแต่ไม่แฉะ ตรวจรอยต่อครั้งแรกที่ราว 3 สัปดาห์ ถ้ากิ่งพันธุ์ยังเขียวสดและตาเริ่มบวมหรือแตกยอดใหม่ แสดงว่าเริ่มติด ยังไม่ต้องแกะพลาสติกทันที รอให้ยอดใหม่แข็งแรงก่อน แล้วตัดยอดต้นตอส่วนที่อยู่เหนือรอยต่อออกเป็นขั้นๆ ไม่ตัดทีเดียวหมด และต้องหมั่นเด็ดยอดที่แตกจากต้นตอใต้รอยต่อออกทุกครั้งที่พบ เพราะมันจะแย่งอาหารจากยอดพันธุ์ดี\" },\n      { h: \"สาเหตุที่รอยต่อไม่ติด\", p: \"อันดับหนึ่ง — น้ำเข้าแผลเพราะพันไม่แน่นหรือพันไม่คลุม อันดับสอง — กิ่งพันธุ์แห้งหรือเก็บไว้นานเกินก่อนใช้ อันดับสาม — มีดไม่คม ทำให้แผลช้ำและเนื้อเยื่อตายจนไม่เชื่อม อันดับสี่ — ขนาดต้นตอกับกิ่งพันธุ์ต่างกันมากจนประกบไม่สนิท อันดับห้า — ทำในช่วงอากาศร้อนจัดหรือต้นตอกำลังเครียดจากการขาดน้ำ ผู้ที่ทำครั้งแรกมักได้อัตราการติดราว 50–70% และดีขึ้นชัดเจนตามจำนวนครั้งที่ทำ ให้ทำหลายต้นในรอบเดียวและจดสิ่งที่ทำต่างกันไว้เทียบผล\" }\n    ] },\n\n  { tag: \"เก็บเกี่ยว\", read: 10, title: \"เก็บเกี่ยวและบ่มอโวคาโด้: รู้ว่าแก่เมื่อไร วิธีเก็บ และการเก็บรักษา\",\n    excerpt: \"เกณฑ์ความแก่ด้วยเปอร์เซ็นต์น้ำหนักแห้ง วิธีตัดที่ถูกต้อง การบ่ม และอุณหภูมิเก็บรักษา\",\n    author: \"ทีมวิชาการ Avocado Geek\", date: \"19 ก.ค. 2569\", imageNote: \"การตัดผลโดยเหลือก้านสั้นติดผล\",\n    keywords: [\"เก็บเกี่ยวอโวคาโด้\", \"อโวคาโด้แก่เมื่อไหร่\", \"บ่มอโวคาโด้\", \"เก็บรักษาอโวคาโด้\"],\n    toc: [\"อโวคาโด้ไม่สุกบนต้น\", \"เกณฑ์ความแก่: เปอร์เซ็นต์น้ำหนักแห้ง\", \"สัญญาณที่สังเกตได้ในสวน\", \"วิธีเก็บที่ถูกต้อง\", \"การบ่มให้สุก\", \"การเก็บรักษาด้วยความเย็น\", \"ความเสียหายจากความเย็นและข้อควรระวัง\"],\n    body: [\n      { h: \"อโวคาโด้ไม่สุกบนต้น\", p: \"นี่คือคุณสมบัติที่ทำให้อโวคาโด้ต่างจากผลไม้เกือบทุกชนิดและเป็นข้อได้เปรียบทางการค้า ผลจะไม่นิ่มพร้อมกินขณะยังติดอยู่บนต้น มันจะเข้าสู่กระบวนการสุกหลังถูกตัดจากต้นเท่านั้น อโวคาโด้จัดเป็นผลไม้ประเภทไคลแมกเทอริก ซึ่งมีการหายใจและการผลิตเอทิลีนเพิ่มขึ้นในช่วงสุก ผลในทางปฏิบัติคือต้นทำหน้าที่เป็นที่เก็บผลผลิตได้ระยะหนึ่ง ผู้ปลูกจึงเลือกจังหวะเก็บตามราคาตลาดได้บ้าง แต่การทิ้งไว้บนต้นนานเกินก็ทำให้คุณภาพและกลิ่นรสเสียได้เช่นกัน\" },\n      { h: \"เกณฑ์ความแก่: เปอร์เซ็นต์น้ำหนักแห้ง\", p: \"ตัวชี้วัดที่ใช้เป็นมาตรฐานในแคลิฟอร์เนียและแหล่งผลิตส่วนใหญ่คือเปอร์เซ็นต์น้ำหนักแห้ง (dry matter) ซึ่งสัมพันธ์อย่างสูงกับปริมาณน้ำมัน ข้อมูลจากศูนย์วิจัยหลังการเก็บเกี่ยว UC Davis ระบุว่าค่าต่ำสุดที่กำหนดอยู่ในช่วง 19–25% ขึ้นกับสายพันธุ์ โดยเฟอร์ทีอยู่ที่ 19.0% แฮสอยู่ที่ 20.8% และเกวนอยู่ที่ 24.2% ส่วนสายพันธุ์กลุ่มฟลอริดาซึ่งมีน้ำมันต่ำกว่าจะใช้เกณฑ์วันนับจากดอกบานเต็มที่แทน ผู้ปลูกวัดค่านี้เองได้โดยชั่งน้ำหนักเนื้อสด อบให้แห้งจนน้ำหนักคงที่ แล้วคำนวณสัดส่วนที่เหลือ\" },\n      { h: \"สัญญาณที่สังเกตได้ในสวน\", p: \"สำหรับผู้ปลูกที่ไม่มีเครื่องมือวัด ให้ใช้สัญญาณประกอบกันหลายอย่าง ผลได้ขนาดและน้ำหนักตามลักษณะของสายพันธุ์ ก้านผลเริ่มเปลี่ยนเป็นสีเหลือง เปลือกของเมล็ดด้านในเปลี่ยนเป็นสีน้ำตาลเข้มและบางลงเมื่อผ่าตรวจ ในสายพันธุ์เปลือกดำอย่างแฮสจะเริ่มเห็นเปลือกเปลี่ยนสี วิธีที่แนะนำที่สุดคือเก็บผลตัวอย่าง 2–3 ผลมาบ่มที่อุณหภูมิห้อง ถ้าสุกนิ่มสม่ำเสมอในเวลาที่เหมาะและรสชาติดี แสดงว่าล็อตนั้นแก่พอเก็บได้ ข้อสังเกตสำคัญคือขนาดผลใหญ่ไม่ได้แปลว่าแก่แล้ว\" },\n      { h: \"วิธีเก็บที่ถูกต้อง\", p: \"ใช้กรรไกรตัดแต่งกิ่งที่คม ไม่บิดหรือดึงผล เพราะการบิดทำให้ก้านหลุดติดผิวผลและเปิดแผลให้เชื้อเข้า ตัดโดยเหลือก้านสั้นติดผลไว้ประมาณ 5–10 มิลลิเมตร ซึ่งช่วยลดการเข้าทำลายของเชื้อที่ทำให้เกิดโรคขั้วผลเน่า เก็บในช่วงเช้าที่อากาศเย็นและผลยังไม่ร้อนจากแดด วางในภาชนะที่บุนวมและไม่ซ้อนกันหนาเกินไป อย่าทิ้งผลกองไว้ในแดด เพราะความร้อนสะสมเร่งการสุกและทำให้คุณภาพเสียเร็ว นำเข้าที่ร่มและทำความเย็นให้เร็วที่สุดหลังเก็บ\" },\n      { h: \"การบ่มให้สุก\", p: \"อุณหภูมิที่เหมาะสำหรับการบ่มอยู่ราว 20–22 องศาเซลเซียส ที่ความชื้นสัมพัทธ์สูง ระยะเวลาขึ้นกับความแก่ของผล ข้อมูลจากคู่มือคุณภาพเชิงอุตสาหกรรมระบุว่าผลที่มีน้ำหนักแห้งต่ำกว่า 23% ต้องใช้เวลาบ่มราว 2–3 วัน ผลที่ 23–26% ใช้ 1–2 วัน และผลที่สูงกว่า 26% ใช้เพียงวันเดียว แปลว่าผลที่แก่จัดกว่าจะสุกเร็วกว่าและสีเปลือกเมื่อสุกเข้มกว่า สำหรับผู้บริโภคทั่วไป การเก็บผลไว้ใกล้ผลไม้ที่ผลิตเอทิลีนสูงอย่างกล้วยจะช่วยเร่งการสุกได้ และผลที่สุกพร้อมกินจะนิ่มลงสม่ำเสมอเมื่อกดเบาๆ ในฝ่ามือ ไม่ใช่กดด้วยปลายนิ้วเพราะทำให้ผลช้ำ\" },\n      { h: \"การเก็บรักษาด้วยความเย็น\", p: \"ผลที่แก่แต่ยังเขียวและแข็งสามารถเก็บที่อุณหภูมิต่ำเพื่อชะลอการสุกได้ ข้อมูลของ UC Davis ระบุว่าแฮสระยะเขียวแก่สามารถเก็บที่ 5–7 องศาเซลเซียสในสภาพบรรยากาศควบคุมที่ออกซิเจน 2% และคาร์บอนไดออกไซด์ 3–5% ได้นานถึง 9 สัปดาห์ แล้วนำมาบ่มในอากาศปกติที่ 20 องศาให้ได้คุณภาพดี ในระดับสวนหรือร้านที่ไม่มีระบบบรรยากาศควบคุม การทำความเย็นให้เร็วหลังเก็บและรักษาอุณหภูมิให้สม่ำเสมอคือปัจจัยสำคัญที่สุด สำหรับผลที่สุกแล้ว การเก็บในตู้เย็นช่วยยืดอายุได้อีกไม่กี่วัน\" },\n      { h: \"ความเสียหายจากความเย็นและข้อควรระวัง\", p: \"อโวคาโด้เสียหายจากความเย็นได้ถ้าอุณหภูมิต่ำเกินไปหรือเก็บนานเกินไป อาการที่พบคือเนื้อและเส้นท่อลำเลียงเปลี่ยนเป็นสีน้ำตาล ผลสุกไม่สม่ำเสมอ และรสชาติเปลี่ยน จุดที่ต้องระวังเป็นพิเศษคือผลที่ยังไม่แก่พอ เพราะจะไวต่อความเสียหายจากความเย็นมากกว่าและสุกได้ไม่ดีแม้บ่มแล้ว นอกจากนี้คาร์บอนไดออกไซด์ที่สูงเกิน 10% อาจเพิ่มการเปลี่ยนสีของเปลือกและเนื้อและทำให้เกิดกลิ่นรสผิดปกติ โดยเฉพาะเมื่อออกซิเจนต่ำกว่า 1% การเก็บที่อุณหภูมิเหมาะสมโดยไม่ควบคุมบรรยากาศจึงปลอดภัยกว่าการควบคุมบรรยากาศแบบผิดวิธี\" }\n    ] },\n\n  { tag: \"ปฏิทิน\", read: 9, title: \"ปฏิทินดูแลอโวคาโด้ตลอดปี: เดือนไหนต้องทำอะไร\",\n    excerpt: \"งานที่ต้องทำในแต่ละช่วงฤดูของไทย ตั้งแต่ช่วงออกดอกจนถึงการฟื้นต้นหลังเก็บเกี่ยว\",\n    author: \"ทีมวิชาการ Avocado Geek\", date: \"15 ก.ค. 2569\", imageNote: \"สวนอโวคาโด้ในช่วงออกดอก\",\n    keywords: [\"ปฏิทินปลูกอโวคาโด้\", \"ดูแลอโวคาโด้ตลอดปี\", \"บำรุงอโวคาโด้ตามฤดู\", \"ตัดแต่งกิ่งอโวคาโด้\"],\n    toc: [\"วิธีใช้ปฏิทินนี้\", \"ธ.ค.–ก.พ. ช่วงสร้างตาดอกและออกดอก\", \"มี.ค.–พ.ค. ช่วงติดผลอ่อนและหน้าแล้ง\", \"มิ.ย.–ส.ค. ช่วงขยายผลและต้นฤดูฝน\", \"ก.ย.–พ.ย. ช่วงเก็บเกี่ยว\", \"หลังเก็บเกี่ยว: ตัดแต่งและฟื้นต้น\", \"งานที่ต้องทำทุกเดือน\"],\n    body: [\n      { h: \"วิธีใช้ปฏิทินนี้\", p: \"ช่วงเวลาในปฏิทินนี้เป็นกรอบกลางสำหรับพื้นที่ปลูกในไทย แต่วันจริงจะเลื่อนตามสายพันธุ์และความสูงของพื้นที่ พันธุ์ที่เก็บต้นฤดูอย่างกลุ่มเวสต์อินดีสจะเลื่อนทุกอย่างเร็วขึ้นราวหนึ่งถึงสองเดือน ส่วนพันธุ์ที่เก็บปลายฤดูอย่างแฮสในพื้นที่สูงจะเลื่อนช้าลง วิธีใช้ที่ถูกต้องคือยึดตามระยะการเจริญของต้นที่เห็นจริงในแปลง ไม่ยึดตามเดือนบนปฏิทิน แล้วจดวันที่ต้นของคุณเข้าแต่ละระยะไว้เพื่อใช้เป็นปฏิทินของสวนตัวเองในปีถัดไป\" },\n      { h: \"ธ.ค.–ก.พ. ช่วงสร้างตาดอกและออกดอก\", p: \"ช่วงนี้ห้ามให้ปุ๋ยไนโตรเจนสูง เพราะจะกระตุ้นให้แตกใบแข่งกับดอกและลดการติดผล ให้น้ำสม่ำเสมอแต่ไม่แฉะ เพราะความเครียดจากการขาดน้ำหรือเกลือในช่วงดอกบานทำให้ใบร่วงมาก เนื่องจากดอกและใบแย่งน้ำกัน ที่สำคัญที่สุดคือห้ามพ่นสารที่เป็นพิษต่อแมลงผสมเกสรในช่วงดอกบาน เพราะการติดผลของอโวคาโด้พึ่งพาแมลงเป็นหลัก และงานวิจัยชี้ว่าผลผลิตของแฮสมักถูกจำกัดด้วยปริมาณละอองเรณูที่ได้รับ หากมีรังผึ้งในพื้นที่ ช่วงนี้คือเวลาที่ควรนำเข้ามาใกล้แปลง\" },\n      { h: \"มี.ค.–พ.ค. ช่วงติดผลอ่อนและหน้าแล้ง\", p: \"ช่วงนี้ผลอ่อนจะร่วงเองตามธรรมชาติจำนวนมากซึ่งเป็นเรื่องปกติ งานที่สำคัญคือรักษาความชื้นดินให้สม่ำเสมอ เพราะการขาดน้ำในช่วงติดผลกระทบผลผลิตอย่างชัดเจน คลุมโคนให้หนาก่อนแดดจัดที่สุดเพื่อลดการใช้น้ำและรักษาอุณหภูมิรากให้เย็น ตรวจและล้างระบบน้ำหยดให้พร้อมก่อนเข้าเดือนที่ร้อนที่สุด และวัดอัตราการไหลจริงต่อต้นเพื่อไม่ให้เข้าใจผิดว่าให้น้ำพอแล้ว ต้นเล็กอายุไม่ถึงสองปีควรมีร่มพรางหรือพืชบังร่มชั่วคราวในช่วงนี้\" },\n      { h: \"มิ.ย.–ส.ค. ช่วงขยายผลและต้นฤดูฝน\", p: \"ผลกำลังสร้างเนื้อและน้ำมัน ธาตุที่ต้องการเพิ่มคือโพแทสเซียม ให้ปุ๋ยแบ่งใส่หลายครั้งครั้งละน้อยแทนการใส่หนักครั้งเดียว ค้ำกิ่งที่ผลดกเพื่อกันกิ่งฉีก จุดเปลี่ยนสำคัญของช่วงนี้คือการจัดการน้ำต้องเปลี่ยนทิศทางทั้งหมด จากการเติมน้ำเป็นการระบายน้ำออก เพราะนี่คือช่วงที่โรครากเน่าระบาดหนักที่สุด ให้เปิดร่องระบายน้ำ ตรวจจุดที่น้ำขังหลังฝนหนัก และงดเข้าไปทำงานในแปลงขณะดินเปียกจัดเพื่อไม่ให้ดินอัดแน่นและพาเชื้อกระจาย\" },\n      { h: \"ก.ย.–พ.ย. ช่วงเก็บเกี่ยว\", p: \"เริ่มจากการตรวจความแก่ด้วยการเก็บผลตัวอย่างมาบ่มทดสอบ หรือวัดเปอร์เซ็นต์น้ำหนักแห้งหากทำได้ ไม่เก็บทั้งแปลงพร้อมกันในครั้งเดียว ให้ทยอยเก็บตามความแก่จริงของแต่ละต้น ใช้กรรไกรตัดเหลือก้านสั้นติดผล เก็บช่วงเช้า และนำเข้าที่ร่มทำความเย็นเร็วที่สุด ช่วงนี้ยังเป็นช่วงที่แอนแทรคโนสแสดงอาการมากที่สุด ให้เก็บผลร่วงและผลเน่าออกจากแปลงอย่างสม่ำเสมอเพราะเป็นแหล่งเชื้อของฤดูถัดไป\" },\n      { h: \"หลังเก็บเกี่ยว: ตัดแต่งและฟื้นต้น\", p: \"หลังเก็บผลหมดคือจังหวะที่ดีที่สุดในการตัดแต่งกิ่ง ให้ตัดกิ่งแห้ง กิ่งเป็นโรค กิ่งไขว้ และกิ่งที่ทำให้ทรงพุ่มทึบเกิน โดยคุมความสูงต้นไว้ในระดับที่จัดการและเก็บผลได้ ข้อควรระวังคืออย่าตัดจนแดดส่องกิ่งใหญ่และลำต้นโดยตรง เพราะเปลือกอโวคาโด้ไหม้แดดง่ายและแผลไหม้เป็นช่องทางเข้าของเชื้อ หากจำเป็นให้ทาปูนขาวป้องกัน จากนั้นใส่ปุ๋ยอินทรีย์ที่ย่อยสลายแล้วเพื่อฟื้นต้น เติมวัสดุคลุมโคนที่ย่อยไปแล้ว และปรับ pH ดินถ้าผลวิเคราะห์บอกว่าจำเป็น\" },\n      { h: \"งานที่ต้องทำทุกเดือน\", p: \"สำรวจแปลงอย่างน้อยเดือนละครั้งโดยเดินดูทุกแถว ไม่ใช่ดูจากขอบแปลง สังเกตสี่อย่าง คือสีและขนาดของใบใหม่ อาการที่ปลายและขอบใบ ความโปร่งของทรงพุ่ม และจุดที่น้ำขังหรือดินแตกระแหง จดบันทึกวันที่ให้ปุ๋ย ให้น้ำ พ่นสาร และวันที่ต้นเข้าแต่ละระยะการเจริญ บันทึกเหล่านี้คือสิ่งที่ทำให้ปีที่สามของคุณจัดการได้ดีกว่าปีแรกอย่างมีนัยสำคัญ และถ้าต้นของคุณมีรหัสตรวจสอบจาก Avocado Geek ให้ผูกบันทึกไว้กับรหัสนั้นเพื่อดูย้อนหลังได้\" }\n    ] }\n];\n\nconst TRAITS = {\n  \"TR-AVO-STD\":     { alt: \"any\",  tree: \"large\",  fruit: \"medium\", taste: \"mild\", price: \"low\",  ease: 1, season: \"mid\",   purpose: [\"rootstock\",\"shade\"] },\n  \"TR-AVO-HAS\": { alt: \"high\", tree: \"medium\", fruit: \"small\",  taste: \"rich\", price: \"high\", ease: 3, season: \"late\",  purpose: [\"market\",\"export\",\"eat\"] },\n  \"TR-AVO-PIN\": { alt: \"high\", tree: \"medium\", fruit: \"medium\", taste: \"rich\", price: \"high\", ease: 3, season: \"late\",  purpose: [\"market\",\"eat\"] },\n  \"TR-AVO-BUC\": { alt: \"low\",  tree: \"medium\", fruit: \"medium\", taste: \"mild\", price: \"low\",  ease: 1, season: \"mid\",   purpose: [\"market\",\"eat\"] },\n  \"TR-AVO-PET\": { alt: \"any\",  tree: \"medium\", fruit: \"large\",  taste: \"mild\", price: \"low\",  ease: 1, season: \"mid\",   purpose: [\"eat\",\"market\"] },\n  \"TR-AVO-BO7\": { alt: \"low\",  tree: \"large\",  fruit: \"large\",  taste: \"mild\", price: \"low\",  ease: 2, season: \"late\",  purpose: [\"market\",\"pollinator\"] },\n  \"TR-AVO-BO8\": { alt: \"low\",  tree: \"medium\", fruit: \"large\",  taste: \"mild\", price: \"low\",  ease: 2, season: \"late\",  purp \n        if (t.alt === \"high\") { score -= 30; cons.push(\"ต้องมีอากาศเย็นช่วงออกดอกจึงติดผลดี ในพื้นที่ต่ำมักติดผลน้อย\"); }\n        else { score += 16; pros.push(\"ทนอากาศร้อนชื้น ปลูกได้ใน \" + region.label); }\n      } else {\n        score += 8; pros.push(\"ปรับตัวได้กับสภาพผสมของ \" + region.label);\n      }\n    }\n\n    if (ans.area) {\n      if (ans.area === \"pot\" || ans.area === \"small\") {\n        if (t.tree === \"small\") { score += 12; pros.push(\"ทรงต้นเตี้ย เหมาะกับพื้นที่จำกัด\"); }\n        else if (t.tree === \"large\") { score -= 10; cons.push(\"ทรงต้นใหญ่ ต้องมีระยะปลูกกว้าง\"); }\n      } else if (ans.area === \"large\" && t.tree === \"large\") {\n        score += 8; pros.push(\"ทรงต้นใหญ่ ให้ผลผลิตต่อต้นสูง คุ้มกับแปลงขนาดใหญ่\");\n      }\n    }\n\n    if (ans.purpose) {\n      if ((t.purpose || []).indexOf(ans.purpose) >= 0) { score += 15; pros.push(\"ตรงกับเป้าหมาย: \" + this.labelOf(\"purpose\", ans.purpose)); }\n      else { score -= 5; cons.push(\"ไม่ได้เด่นเรื่อง \" + this.labelOf(\"purpose\", ans.purpose)); }\n    }\n    if (ans.tree) {\n      if (t.tree === ans.tree) { score += 10; pros.push(\"ขนาดทรงต้นตรงตามที่ต้องการ\"); }\n      else { score -= 4; }\n    }\n    if (ans.fruit) {\n      if (t.fruit === ans.fruit) { score += 10; pros.push(\"ขนาดผลตรงตามที่ต้องการ\"); }\n      else { score -= 4; cons.push(\"ขนาดผลไม่ตรงกับที่เลือก\"); }\n    }\n    if (ans.taste) {\n      if (t.taste === ans.taste) { score += 12; pros.push(ans.taste === \"rich\" ? \"เนื้อมันเข้ม น้ำมันสูง\" : \"รสอ่อน เบา ไม่เลี่ยน\"); }\n      else { score -= 7; cons.push(ans.taste === \"rich\" ? \"รสค่อนข้างอ่อน น้ำมันไม่สูง\" : \"รสมันเข้ม อาจหนักกว่าที่ชอบ\"); }\n    }\n    if (ans.price) {\n      if (t.price === ans.price) { score += 10; pros.push(\"ระดับราคาตลาดตรงกับที่ตั้งใจ\"); }\n      else if (ans.price === \"high\" && t.price === \"low\") { score -= 8; cons.push(\"ราคาตลาดค่อนข้างต่ำ เน้นปริมาณมากกว่าราคา\"); }\n      else { score -= 3; }\n    }\n score), rank: score + tb, pros: pros.slice(0, 4), cons: cons.slice(0, 2) };\n  }\n\n  labelOf(key, value) {\n    const q = QUESTIONS.filter((x) => x.key === key)[0];\n    if (!q) return value;\n    const o = q.options.filter((x) => x.v === value)[0];\n    return o ? o.label : value;\n  }\n\n  selectTab(key) {\n    return (e) => {\n      if (e && e.preventDefault) e.preventDefault();\n      this.setState({ tab: key });\n    };\n  }\n\n  renderVals() {\n    const s = this.state;\n    const goVariety = (i) => this.nav(\"varietyDetail\", { vi: i, tab: \"info\" });\n    const goArticle = (i) => this.nav(\"article\", { ai: i });\n    const goSeller = (i) => this.nav(\"sellerDetail\", { si: i });\n\n    const varieties = VARIETIES.map((v, i) => Object.assign({}, v, { open: goVariety(i) }));\n    const posts = POSTS.map((p, i) => Object.assign({}, p, { open: goArticle(i) }));\n    const sellers = SELLERS.map((x, i) => Object.assign({}, x, {\n      open: goSeller(i),\n      tagline: (x.tags || []).join(\" · \")\n    }));\n    const article = POSTS[s.ai];\n    const variety = VARIETIES[s.vi];\n    const seller = SELLERS[s.si];\n    const activeTab = TABS.filter((t) => t.key === s.tab)[0] || TABS[0];\n\n    const hasFilter = !!s.vf;\n    const key = hasFilter ? String(s.vf).split(\"(\")[0].trim() : \"\";\n    const filtered = hasFilter ? posts.filter((p) => {\n      const hay = [p.title, p.excerpt, (p.keywords || []).join(\" \"),\n        (p.body || []).map((b) => b.h + \" \" + b.p).join(\" \")].join(\" \");\n      return hay.indexOf(key) >= 0;\n    }) : [];\n\n    return {\n      isHome: s.page === \"home\", isBlog: s.page === \"blog\", isArticle: s.page === \"article\",\n      isVarieties: s.page === \"varieties\", isVarietyDetail: s.page === \"varietyDetail\",\n      isSellers: s.page === \"sellers\", isSellerDetail: s.page === \"sellerDetail\",\n      isAbout: s.page === \"about\", isContact: s.page === \"contact\", isMatch: s.page === \"match\",\n      goHome: this.nav(\" on === r.key ? \"#CFE2CB\" : \"#8A8A80\",\n        border: s.ans.region === r.key ? \"#2D5F2E\" : \"#E7E4D9\"\n      })),\n      provinceChips: (REGIONS.filter((r) => r.key === s.ans.region)[0] || { provinces: [] }).provinces.map((p) => ({\n        label: p, select: this.pick(\"province\", p),\n        bg: s.ans.province === p ? \"#EAF3E6\" : \"#fff\",\n        fg: s.ans.province === p ? \"#2D5F2E\" : \"#4A4A42\",\n        border: s.ans.province === p ? \"#70B75C\" : \"#E7E4D9\"\n      })),\n      hasRegion: !!s.ans.region,\n      questions: QUESTIONS.map((q) => ({\n        label: q.label,\n        options: q.options.map((o) => ({\n          label: o.label, select: this.pick(q.key, o.v),\n          bg: s.ans[q.key] === o.v ? \"#EAF3E6\" : \"#fff\",\n          fg: s.ans[q.key] === o.v ? \"#2D5F2E\" : \"#4A4A42\",\n          border: s.ans[q.key] === o.v ? \"#70B75C\" : \"#E7E4D9\",\n          weight: s.ans[q.key] === o.v ? \"600\" : \"500\"\n        }))\n      })),\n      answeredCount: Object.keys(s.ans).filter((k) => s.ans[k]).length,\n      resetMatch: this.resetMatch,\n      matches: VARIETIES.map((v, i) => {\n        const r = this.scoreVariety(v, s.ans);\n        return {\n          name: v.name, sku: v.sku, sci: v.sci, season: v.season, desc: v.desc,\n          score: r.score, rank: r.rank, bar: r.score + \"%\", pros: r.pros, cons: r.cons,\n          open: goVariety(i),\n          tone: r.score >= 80 ? \"#2D5F2E\" : (r.score >= 60 ? \"#70B75C\" : \"#C9A227\"),\n          verdict: r.score >= 80 ? \"เหมาะมาก\" : (r.score >= 60 ? \"พอเหมาะ\" : \"ควรพิจารณา\")\n        };\n      }).sort((a, b) => b.rank - a.rank),\n\n      topVarieties: [varieties[1], varieties[2], varieties[6], varieties[10]],\n      topPosts: posts.slice(0, 3),\n      varieties: varieties,\n      varietyCount: varieties.length,\n      posts: hasFilter ? (filtered.length ? filtered.slice(1) : posts) : posts.slice(1),\n      showPagination: !hasFilter,\n      showFeatured: hasFilter ? filtered.length > 0 : true,\n      featured: hasFilter ? (filtered[0] || {}) : Object.assign({}, POSTS[0]),\n      openFeatured: hasFilter ? (filtered[0] ? filtered[0].open : this.nav(\"blog\")) : goArticle(0),\n      hasVarietyFilter: hasFilter,\n      filterLabel: s.vf || \"\",\n      filterCount: filtered.length,\n      clearFilter: this.nav(\"blog\", { vf: null }),\n      noFilterMatch: hasFilter && filtered.length === 0,\n      blogTags: [\"เริ่มต้น\", \"สายพันธุ์\", \"การปลูก\", \"ดิน\", \"การให้น้ำ\", \"ปัญหา\", \"การขยายพันธุ์\", \"เทคนิค\", \"เก็บเกี่ยว\", \"ปฏิทิน\"],\n\n      article: Object.assign({}, article, {\n        initial: article.author.slice(0, 1),\n        heroId: \"art-hero-\" + s.ai,\n        body: article.body.map((b, bi) => Object.assign({}, b, { imgId: b.imgId || (\"art-\" + s.ai + \"-\" + bi) }))\n      }),\n      related: posts.filter((p, i) => i !== s.ai).slice(0, 3),\n      mentioned: [varieties[1], varieties[4]],\n\n      variety: variety,\n      goVarietyArticles: this.nav(\"blog\", { vf: variety.name }),\n      tabs: TABS.map((t) => ({\n        label: t.label, select: this.selectTab(t.key),\n        color: t.key === s.tab ? \"#1F4420\" : \"#8A8A80\",\n        border: t.key === s.tab ? \"#2D5F2E\" : \"transparent\"\n      })),\n      tabContent: activeTab.content,\n\n      sellers: sellers,\n      topSellers: sellers.slice(0, 3),\n      relatedSellers: sellers.filter((x, i) => i !== s.si).slice(0, 3),\n      seller: seller,\n      sellerFilters: [\n        { label: \"สินค้า\", options: [\"ผลสด\", \"ต้นพันธุ์\"] },\n        { label: \"ช่องทาง\", options: [\"ออนไลน์\", \"หน้าสวน / หน้าร้าน\"] }\n      ],\n      sellerCount: SELLERS.length,\n      filters: [\n        { label: \"ระดับความยาก\", options: [\"ง่าย\", \"ปานกลาง\", \"ยาก\"] },\n        { label: \"ฤดูเก็บเกี่ยว\", options: [\"มิ.ย.–ส.ค.\", \"ก.ย.–พ.ย.\", \"ธ.ค.–ก.พ.\"] },\n        { label: \"ขนาดผล\", options: [\"เล็ก (<200 ก.)\", \"กลาง (200–350 ก.)\", \"ใหญ่ (>350 ก.)\"] },\n        { la
